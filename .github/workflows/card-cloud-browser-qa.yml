# ISOLATED QA-ONLY REF. NEVER MERGE: the main CI workflow is absent on this ref only.
# No SQL, provider calls, submission flags, real accounts or employer destinations.
name: card-cloud-browser-only-qa
on:
  push:
    branches: [ci/card-cloud-browser-baseline-20261022]
permissions:
  contents: read
jobs:
  captured-local-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: baseline
            source: 01401cb456bc2982d67316165e183bbd275581c9
            pass_count: 4
            fail_count: 3
          - arm: candidate
            source: dff3dfc1bc5c34ff177df65cddfff212abebd676
            pass_count: 7
            fail_count: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 68e70bbcaaeadc2c650ef1fc895f96d587a6450d
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: "22.23.3"}
      - uses: denoland/setup-deno@v2
        with: {deno-version: "v2.9.6"}
      - name: Install only browser tools
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund playwright@1.64.1
          echo "UPMORE_PLAYWRIGHT_PATH=$RUNNER_TEMP/browser-tools/node_modules/playwright" >> "$GITHUB_ENV"
          browser_path=$(command -v google-chrome)
          test -x "$browser_path"
          echo "UPMORE_CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
          echo "DENO_BIN=$(command -v deno)" >> "$GITHUB_ENV"
      - name: Allow sandboxed Chromium user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Actual captured form, loopback employer only, parent-child lease fence
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
          SOURCE_SHA: ${{ matrix.source }}
          EXPECT_PASS: ${{ matrix.pass_count }}
          EXPECT_FAIL: ${{ matrix.fail_count }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C qa rev-parse HEAD)" = "68e70bbcaaeadc2c650ef1fc895f96d587a6450d"
          cp qa/tests/career-cloud-worker-card-bridge-lever.test.cjs source/tests/career-cloud-worker-card-bridge-lever.test.cjs
          sha256sum source/tests/career-cloud-worker-card-bridge-lever.test.cjs > "$RUNNER_TEMP/test-source.sha256"
          set +e
          node --test --test-reporter=tap source/tests/career-cloud-worker-card-bridge-lever.test.cjs > "$RUNNER_TEMP/browser.tap" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/browser.tap"
          export TEST_EXIT="$result"
          python3 - <<'PYCODE'
          import os,re,json,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);text=(temp/'browser.tap').read_text()
          def count(name):
              found=re.search(r'^# '+name+r' (\d+)$',text,re.M)
              if not found: raise RuntimeError('Incomplete TAP: '+name)
              return int(found.group(1))
          actual={name:count(name) for name in ['tests','pass','fail','skipped']}
          result={'arm':os.environ['ARM'],'source_sha':os.environ['SOURCE_SHA'],
              'test_sha':'68e70bbcaaeadc2c650ef1fc895f96d587a6450d','counts':actual,
              'exit':int(os.environ['TEST_EXIT']),'scope':'Actual sandboxed browser, synthetic captured form and loopback HTTP; no SQL or live employers','new_cost_usd':0}
          (temp/'verdict.json').write_text(json.dumps(result,indent=2)+'\n')
          assert actual=={'tests':7,'pass':int(os.environ['EXPECT_PASS']),'fail':int(os.environ['EXPECT_FAIL']),'skipped':0},result
          assert result['exit']==(1 if actual['fail'] else 0),result
          PYCODE
      - name: Retain raw TAP and source-bound counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-cloud-${{ matrix.arm }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/browser.tap
            ${{ runner.temp }}/verdict.json
            ${{ runner.temp }}/test-source.sha256
          if-no-files-found: warn
