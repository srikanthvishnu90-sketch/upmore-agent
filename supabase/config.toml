# Explicit gateway modes for the new authenticated workflow and worker units.
# https://supabase.com/docs/guides/functions/function-configuration
# Webhooks/workers authenticate in their handlers; no endpoint is public data.
[functions.agent-workflows]
verify_jwt = true

[functions.agent-chat]
verify_jwt = true

[functions.agent-message-inbound]
verify_jwt = false

[functions.agent-message-turn]
verify_jwt = false

[functions.agent-message-worker]
verify_jwt = false

[functions.agent-payments]
verify_jwt = false

# Brokerage connect: start needs the signed-in person; the callback is a browser redirect from the broker with no Upmore
# JWT, authenticated by the signed, single-use OAuth state instead.
[functions.broker-oauth-start]
verify_jwt = true

[functions.broker-oauth-callback]
verify_jwt = false

[functions.model-health]
verify_jwt = false

# Guided manual connect: every action is the signed-in person's own (consent, the live sign-in window, read, disconnect).
[functions.manual-connect]
verify_jwt = true

# WO-035 voice mock: the app's voice page has no Upmore session; the signed, single-use, 10-minute link (and the call
# token it returns) authorizes each action in the handler.
[functions.career-voice]
verify_jwt = false

# WO-049: the extension card's "Draft from my facts": the signed-in person's own session only.
[functions.career-essay-draft]
verify_jwt = true

[functions.career-email-code]
verify_jwt = true

# Trainee landing page capture: public endpoints (the static page ships no
# credentials). Handlers write with the service role into RLS-locked tables
# (site_waitlist, site_careers_applications) and a private storage bucket.
[functions.site-signup]
verify_jwt = false

[functions.site-careers]
verify_jwt = false

# F-RUNNER: the dispatcher (shared secret header) and the job bridge (per-job HMAC token) authenticate themselves.
[functions.career-cloud-runner]
verify_jwt = false

# M4: the Outlook connect link and Microsoft's redirect carry no Upmore JWT; the one-time link, the signed state and
# the jobs secret authenticate in the handler (_shared/outlook_connector.ts).
[functions.outlook-oauth]
verify_jwt = false

# Hosted file pages: the signed, expiring, single-user token in the link is the credential (no Upmore JWT in a browser tab).
[functions.trainee-file]
verify_jwt = false

# Owner monitoring: the scheduler carries no JWT; the OPS_MONITOR_TOKEN authenticates in the handler.
[functions.ops-monitor]
verify_jwt = false
