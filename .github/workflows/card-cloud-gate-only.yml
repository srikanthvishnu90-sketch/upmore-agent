name: Card cloud complete free gate only
# Isolated QA ref ONLY. Never merge this configuration; no database job.
on:
  push:
    branches: [ci/card-cloud-gate-only-20261022]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    # The gate took 9.3-9.6 min on #62 (2026-10-20), its career-and-shared step alone 520-537 s; at 10 the next test
    # cancelled it (5470fe98). Headroom, not a target: a slower gate is still a finding.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d8f486e4adcf891ab72bce6b0cea6b227b4c0f3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - name: Install tooling and use the runner's packaged Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/wo001-tools" --no-audit --no-fund playwright@1.64.1 esbuild@0.25.12
          # WO-031: an unpacked extension loads only in Chromium (branded Chrome ignores --load-extension); the extension
          # suite (tests/career-extension-browser.test.cjs) finds Playwright's own Chromium through UPMORE_PLAYWRIGHT_PATH.
          (cd "$RUNNER_TEMP/wo001-tools" && npx --no-install playwright install chromium)
          browser_path=$(command -v google-chrome)
          test -x "$browser_path"
          echo "UPMORE_PLAYWRIGHT_PATH=$RUNNER_TEMP/wo001-tools/node_modules/playwright" >> "$GITHUB_ENV"
          echo "UPMORE_CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
          echo "ESBUILD_BIN=$RUNNER_TEMP/wo001-tools/node_modules/.bin/esbuild" >> "$GITHUB_ENV"
          # The pay-data importer tests read a real .xlsx (WO-036); a venv keeps the runner's system Python untouched.
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet openpyxl==3.1.5
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: Allow sandboxed Chromium user namespaces for this gate job
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Six launcher dispatch controls (fake psql only; no SQL)
        run: python3 tests/career-card-cloud-migration-launcher.test.py
      - name: Career gate
        run: bash scripts/gate.sh
