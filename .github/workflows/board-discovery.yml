# WO-037 / WO-044: board discovery at scale, and the real postings for the 200-role labeled set. Runs where the internet
# is (CI; the build sandbox has none): weekly, and on demand. Public requests only (GET; HEAD for a crawl's index; one
# read-only POST: Workday's job search), paced per host, robots.txt read first, a User-Agent naming Upmore with a contact
# URL. No secrets. Each run commits its output to a NEW branch named discovery/... (never trunk or main) for the architect
# to open as a PR, and uploads it as an artifact.
# WO-044: three stages so the whole candidate set is probed inside GitHub's 6-hour job limit: gather (the sources, one
# job), verify (one job per provider, in parallel: each provider's hosts keep their own pace, so splitting by provider adds
# no load to any host), merge (one job: the verdicts, the summary, the directory, the discovery/ branch).
name: board-discovery
on:
  workflow_dispatch:
    inputs:
      gather_minutes: { description: "Budget for gathering candidates (minutes)", default: "90" }
      max_minutes: { description: "Budget per provider's verify job (minutes)", default: "270" }
      cc_crawls: { description: "Known Common Crawl crawls (newer weekly ones are found with a HEAD)", default: "CC-MAIN-2026-39,CC-MAIN-2026-34" }
      crawls: { description: "Latest Common Crawl crawls to read", default: "2" }
      cc_blocks: { description: "Common Crawl index blocks read per provider prefix per crawl", default: "1500" }
      domains_limit: { description: "Top domains turned into slug guesses (0 = none)", default: "3000" }
      wb_pages: { description: "Wayback Machine CDX pages read per query", default: "60" }
      hn_pages: { description: "Hacker News search pages (1,000 comments each) per query", default: "40" }
      providers: { description: "Providers to verify (comma list, or all)", default: "all" }
      resume_branch: { description: "A discovery/ branch whose dead verdicts need no new probe (empty = probe all)", default: "" }
      label_pool: { description: "Also collect the labeled-set pool (yes / no)", default: "yes" }
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  # TEMPORARY (WO-044): the MCP integration cannot dispatch (403); removed in the final commit, as WO-037 did.
  push:
    branches: [wo/044-discovery-scale]
    paths: [.github/workflows/board-discovery.yml]
permissions:
  contents: write
concurrency: { group: board-discovery, cancel-in-progress: false }
env:
  UA: "UpmoreTrainee-BoardDiscovery/1.0 (+https://github.com/srikanthvishnu90-sketch/upmore-agent)"
jobs:
  gather:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GATHER_MINUTES: ${{ inputs.gather_minutes || '20' }}
      CC_CRAWLS: ${{ inputs.cc_crawls || 'CC-MAIN-2026-39,CC-MAIN-2026-34' }}
      CRAWLS: ${{ inputs.crawls || '1' }}
      CC_BLOCKS: ${{ inputs.cc_blocks || '15' }}
      DOMAINS_LIMIT: ${{ inputs.domains_limit || '40' }}
      WB_PAGES: ${{ inputs.wb_pages || '2' }}
      HN_PAGES: ${{ inputs.hn_pages || '2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - name: A ranked domain list (Tranco top 1M, tranco-list.eu), for slug guesses
        run: |
          if [ "$DOMAINS_LIMIT" != "0" ]; then
            curl -sSfL --max-time 120 -A "$UA" https://tranco-list.eu/top-1m.csv.zip -o tranco.zip && unzip -p tranco.zip > domains.csv || echo "no domain list this run"
          fi
          touch domains.csv; wc -l domains.csv
      - name: Gather candidates (directory, WO-017 candidates, Common Crawl index files, board sitemaps, domain guesses)
        run: |
          mkdir -p gather-out
          deno run -A --no-check scripts/career/discover-boards.ts --phase gather \
            --sources diagnose,directory,candidates,hn,wayback,ccdata,sitemaps,commoncrawl,workday-robots,domains --domains domains.csv --domains-limit "$DOMAINS_LIMIT" \
            --cc-crawls "$CC_CRAWLS" --crawls "$CRAWLS" --cc-blocks "$CC_BLOCKS" --wb-pages "$WB_PAGES" --hn-pages "$HN_PAGES" \
            --max-minutes "$GATHER_MINUTES" --out-dir gather-out \
            | tee gather-out/gather.log | grep -E '^(SOURCES|ROBOTS|CCDATA|WAYBACK|HN|WORKDAY_ROBOTS|SITEMAP|CC )'
          grep -m1 '^SOURCES' gather-out/gather.log | cut -c1-3900 | sed 's/^/::notice title=SOURCES::/'
      - uses: actions/upload-artifact@v4
        with: { name: candidates, path: gather-out, retention-days: 30 }

  verify:
    needs: gather
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        provider: [greenhouse, lever, ashby, smartrecruiters, workable, recruitee, bamboohr, teamtailor, breezy, personio, workday]
    env:
      PROVIDER: ${{ matrix.provider }}
      PROVIDERS: ${{ inputs.providers || 'all' }}
      MAX_MINUTES: ${{ inputs.max_minutes || '12' }}
      RESUME_BRANCH: ${{ inputs.resume_branch || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - uses: actions/download-artifact@v4
        with: { name: candidates, path: gather-out }
      - name: An earlier run's verdicts (only its dead slugs are skipped)
        run: |
          touch prior.jsonl
          case "$RESUME_BRANCH" in
            "") ;;
            discovery/*) if printf '%s' "$RESUME_BRANCH" | grep -Eq '^discovery/[A-Za-z0-9._-]+$'; then
                git fetch --depth 1 origin "refs/heads/$RESUME_BRANCH" && git show FETCH_HEAD:packages/career-data/discovery-verdicts.jsonl.gz | gunzip > prior.jsonl || true
              fi ;;
            *) echo "resume_branch must be a discovery/ branch"; exit 1 ;;
          esac
          wc -l prior.jsonl
      - name: Verify (200 with the expected shape, nothing else)
        run: |
          mkdir -p "verify-out/$PROVIDER"
          if [ "$PROVIDERS" != "all" ] && ! printf ',%s,' "$PROVIDERS" | grep -q ",$PROVIDER,"; then echo "skipped: $PROVIDER not in $PROVIDERS"; exit 0; fi
          deno run -A --no-check scripts/career/discover-boards.ts --phase verify --candidates gather-out/candidates.jsonl \
            --providers "$PROVIDER" --resume prior.jsonl --max-minutes "$MAX_MINUTES" --out-dir "verify-out/$PROVIDER" \
            | tee "verify-out/$PROVIDER/verify.log" | grep -E '^(SHARD|RESUME|progress)'
          grep -m1 '^SHARD' "verify-out/$PROVIDER/verify.log" | cut -c1-3900 | sed "s/^/::notice title=SHARD $PROVIDER::/"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "verdicts-${{ matrix.provider }}", path: verify-out, retention-days: 30 }

  merge:
    needs: [gather, verify]
    if: always() && needs.gather.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - uses: actions/download-artifact@v4
        with: { pattern: "verdicts-*", path: shards }
      - uses: actions/download-artifact@v4
        with: { name: candidates, path: shards/gather }
      - name: Merge the verdicts; the directory and the ingest list
        run: |
          rm -f shards/gather/candidates.jsonl
          mkdir -p discovery-out
          deno run -A --no-check scripts/career/discover-boards.ts --phase merge --verdicts-dir shards --out-dir discovery-out --merge \
            | tee discovery-out/run.log | grep -E '^(CALIBRATION|TALLY|CONDITIONAL|BY_PROVIDER|BY_SOURCE|VERIFIED|MERGED|PARTIAL)'
          deno run -A --no-check scripts/build-ingest-boards.ts
      - name: Say the numbers where the API can read them
        run: |
          for k in VERIFIED BY_PROVIDER BY_SOURCE MERGED TALLY CALIBRATION CONDITIONAL; do
            line=$(grep -m1 "^$k" discovery-out/run.log || true); [ -n "$line" ] && echo "::notice title=$k::${line:0:3900}"
          done
          true
      - uses: actions/upload-artifact@v4
        with: { name: board-discovery, path: discovery-out, retention-days: 30 }
      - name: Commit the refreshed directory to a new discovery/ branch (never trunk or main)
        run: |
          branch="discovery/boards-${{ github.run_id }}"
          case "$branch" in discovery/*) ;; *) echo "refusing to push $branch"; exit 1 ;; esac
          git config user.name "board-discovery[bot]"; git config user.email "board-discovery@users.noreply.github.com"
          git checkout -b "$branch"
          gzip -9 -c discovery-out/verdicts.jsonl > packages/career-data/discovery-verdicts.jsonl.gz
          cp discovery-out/summary.json packages/career-data/discovery-summary.json
          git add packages/career-data/board-directory.json supabase/functions/career-ingest/boards.json packages/career-data/discovery-verdicts.jsonl.gz packages/career-data/discovery-summary.json
          git commit -m "board discovery run ${{ github.run_id }}: $(grep -m1 '^VERIFIED' discovery-out/run.log | cut -c1-200)"
          git push origin "HEAD:refs/heads/$branch"
          echo "::notice title=BRANCH::$branch"

  label-pool:
    if: inputs.label_pool != 'no' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - name: Real postings for the 200-role labeled set, read with the product's own feed reader
        run: deno run -A --no-check evals/career/alert-labels/collect-pool.ts --out-dir label-pool-out | tee label-pool-out.log
      - name: Say the numbers
        run: grep -E '^(POOL|STRATA)' label-pool-out.log | head -12 | while read -r l; do echo "::notice title=LABEL_POOL::$l"; done
      - uses: actions/upload-artifact@v4
        with: { name: label-pool, path: label-pool-out, retention-days: 30 }
      - name: Commit the candidates to a new discovery/ branch (never trunk or main)
        run: |
          branch="discovery/label-pool-${{ github.run_id }}"
          git config user.name "board-discovery[bot]"; git config user.email "board-discovery@users.noreply.github.com"
          git checkout -b "$branch"
          cp label-pool-out/candidates.json evals/career/alert-labels/candidates.json
          git add evals/career/alert-labels/candidates.json
          git commit -m "label pool run ${{ github.run_id }}: $(grep -m1 '^POOL' label-pool-out.log | cut -c1-200)"
          git push origin "HEAD:refs/heads/$branch"
          echo "::notice title=BRANCH::$branch"
