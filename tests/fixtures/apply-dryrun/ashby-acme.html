<!doctype html><html><head><meta charset="utf-8"><title>Software Engineer @ Acme Robotics (TEST fixture)</title><style>body{font:15px system-ui;max-width:680px;margin:20px auto}.ashby-application-form-question-title{font-weight:600;display:block;margin:12px 0 4px}input[type=text],input[type=email],input[type=tel],textarea,select{width:100%;padding:7px;box-sizing:border-box}button[aria-pressed=true]{background:#1a7f5a;color:#fff}</style></head><body>
<p>TEST FIXTURE modeled on an Ashby application form (not a real employer)</p>
<form class="ashby-application-form"><div class="ashby-application-form-section-container">
<div class="ashby-application-form-field-entry"><label class="_heading_x _required_x ashby-application-form-question-title" for="_systemfield_name">Name</label><input id="_systemfield_name" name="_systemfield_name" type="text" class="ashby-application-form-input-text" required></div>
<div class="ashby-application-form-field-entry"><label class="_heading_x _required_x ashby-application-form-question-title" for="_systemfield_email">Email</label><input id="_systemfield_email" name="_systemfield_email" type="email" class="ashby-application-form-input-text" required></div>
<div class="ashby-application-form-field-entry"><label class="_heading_x _required_x ashby-application-form-question-title" for="_systemfield_resume">Resume</label><button type="button">Upload file</button><input id="_systemfield_resume" name="_systemfield_resume" type="file" style="display:none"></div>
<div class="ashby-application-form-field-entry"><label class="_heading_x ashby-application-form-question-title" for="ph1">Phone Number</label><input id="ph1" name="ph1" type="tel" class="ashby-application-form-input-text"></div>
<div class="ashby-application-form-field-entry"><label class="_heading_x ashby-application-form-question-title" for="li1">LinkedIn</label><input id="li1" name="li1" type="text" class="ashby-application-form-input-text"></div>
<div class="ashby-application-form-field-entry"><label class="_heading_x _required_x ashby-application-form-question-title">Are you legally authorized to work in the United States?</label><div class="ashby-application-form-input-yesno"><button type="button" class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button type="button" class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" tabindex="-1" name="auth"></div></div>
<div class="ashby-application-form-field-entry"><label class="_heading_x _required_x ashby-application-form-question-title">Will you require visa sponsorship?</label><div class="ashby-application-form-input-yesno"><button type="button" class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button type="button" class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" tabindex="-1" name="spons"></div></div>
<div class="ashby-application-form-field-entry"><label class="_heading_x _required_x ashby-application-form-question-title" for="office">Which office would you work from?</label><select id="office" name="office"><option value="">Select...</option><option value="sf">San Francisco</option><option value="ny">New York</option><option value="rem">Remote</option></select></div>
<div class="ashby-application-form-field-entry"><fieldset><legend class="ashby-application-form-question-title">Teams of interest</legend><label><input type="checkbox" name="teams" value="a"> Perception</label><label><input type="checkbox" name="teams" value="b"> Planning</label><label><input type="checkbox" name="teams" value="c"> Platform</label></fieldset></div>
<div class="ashby-application-form-field-entry"><label class="_heading_x _required_x ashby-application-form-question-title" for="proj">Tell us about a project you are proud of</label><textarea id="proj" name="proj"></textarea></div>
<div class="ashby-application-form-field-entry"><fieldset><legend class="ashby-application-form-question-title">Voluntary self-identification: Veteran status</legend><label><input type="radio" name="vet" value="1"> I am a veteran</label><label><input type="radio" name="vet" value="2"> I am not a veteran</label><label><input type="radio" name="vet" value="3"> I prefer not to say</label></fieldset></div>
<div class="ashby-application-form-field-entry"><label class="_heading_x ashby-application-form-question-title" for="gen">Gender</label><select id="gen" name="gen"><option value="">Select...</option><option>Man</option><option>Woman</option><option>Decline to self-identify</option></select></div>
</div><button class="ashby-application-form-submit-button" type="submit">Submit Application</button></form><script src="/widgets.js"></script></body></html>
