# WO-017: verify harvested board candidates against each provider's public postings feed. Runs only when the candidates
# or the verifier change (in a PR), because CI has the internet access the build sandbox lacks. GET/POST of public job
# search endpoints only, paced, no login, nothing submitted. The verdicts are uploaded and printed; the architect merges
# them into the directory with scripts/career/merge-board-verdicts.cjs in the same PR.
name: verify-boards
on:
  pull_request:
    paths:
      - packages/career-data/board-candidates.json
      - scripts/career/verify-board-candidates.cjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - name: Verify every candidate (one calibration probe per provider first)
        run: node scripts/career/verify-board-candidates.cjs --out board-verdicts.jsonl | grep -E '^(CALIBRATION|TALLY)'
      - name: Live boards found
        run: grep '"verdict":"live"' board-verdicts.jsonl | sed 's/^/LIVE /'
      - uses: actions/upload-artifact@v4
        with: { name: board-verdicts, path: board-verdicts.jsonl, retention-days: 14 }
