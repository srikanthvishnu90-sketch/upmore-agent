# Router before/after (2026-10-22, owner's $5 approval 21:43 CDT, relayed): v248's router (cea914fe) vs the candidate's
# router (373453f3) on the held-out set minus the 8 burned items (evals/career/heldout-burned.json): 30 items, the same
# harness (this tree's evals/career/run.ts with --brain-root), the same two judges (gpt-5-mini + gpt-4.1-mini, an item
# passes only when both pass it), two passes per config, four runs at most, in sequence. This measures; it waives nothing
# and deploys nothing.
# Spend (fail-closed since 2026-10-23, after the parent's cap review): every ledger read, refusal and paid call is in
# scripts/eval/rba-ledger.sh, tested by tests/eval-rba-ledger.test.cjs. A run happens only when ls-remote and the fetch of
# ci/router-before-after both succeed (a ref that exists but cannot be read refuses), there is no DONE or INFLIGHT marker,
# every recorded cost is numeric, and the remaining authorized total covers the reserve. Each run's INFLIGHT marker is
# pushed before the run; each run gets --run-budget-usd <remaining>, never the full cap. Nothing is force-pushed.
# The 21:43 grant is closed: it spent $0.050843 and the remaining balance is not a grant, so AUTHORIZED_TOTAL_USD equals
# what was spent and every run refuses. A new run needs the owner's new approval, raising it in a reviewed commit.
name: router-before-after
on:
  push:
    branches: [eval/router-before-after]
    paths: [.github/workflows/router-before-after.yml]
permissions:
  contents: write
concurrency: { group: router-before-after, cancel-in-progress: false }
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_JUDGE_MODEL: gpt-5-mini
      EVAL_JUDGE_MODEL_2: gpt-4.1-mini
      AUTHORIZED_TOTAL_USD: "0.050843"
      LEDGER_FLOOR_USD: "0.050843"
      LEDGER_REF: ci/router-before-after
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - name: The key is present
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "NOT RUN: the OPENAI_API_KEY secret is not set"; exit 2; fi
      - name: The ledger allows a run (no paid call in this step)
        run: bash scripts/eval/rba-ledger.sh check
      - name: The two router checkouts
        run: |
          git worktree add --detach "$RUNNER_TEMP/v248" cea914fe
          git worktree add --detach "$RUNNER_TEMP/cand" 373453f3
      - name: Four runs in sequence, each under the remaining authorized total
        env: { RUN_ID: "${{ github.run_id }}" }
        run: bash scripts/eval/rba-ledger.sh run
      - name: Report (reads the ledger; writes nothing)
        if: always()
        run: |
          git fetch -q origin "+refs/heads/$LEDGER_REF:refs/remotes/origin/$LEDGER_REF" || { echo "the ledger could not be read"; exit 0; }
          mkdir -p "$RUNNER_TEMP/report" && git archive "origin/$LEDGER_REF" evals/career | tar -x -C "$RUNNER_TEMP/report"
          ls "$RUNNER_TEMP/report/evals/career/router-before-after/" 2>/dev/null
          python3 - "$RUNNER_TEMP/report/evals/career/results" <<'PY'
          import json, os, sys
          d = sys.argv[1]; total = 0.0
          for n in sorted(x for x in os.listdir(d) if x.endswith(".json")) if os.path.isdir(d) else []:
              r = json.load(open(os.path.join(d, n))); c = r["cost_usd"]["brain"] + r["cost_usd"]["judge"]; total += c
              print(f"{r['label']}: router {r.get('brain_root_commit')} · {r['passed']}/{r['total']} both-pass{' STOPPED (not a score)' if r.get('stopped') else ''} · ${c:.6f}")
          print(f"total ${total:.6f}")
          PY
