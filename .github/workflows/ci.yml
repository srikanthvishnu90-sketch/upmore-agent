# Every push and pull request: the same checks a contributor runs locally (CLAUDE.md "Commands"). No step is allowed to
# fail quietly; the live gauntlet is not here (it needs the deployed handler and a test JWT) and is run by go-live.sh.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - name: Parser and isolated SQL test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils python3-venv
          python3 -m venv "$RUNNER_TEMP/upmore-parser-venv"
          "$RUNNER_TEMP/upmore-parser-venv/bin/pip" install python-docx==1.2.0
          echo "$RUNNER_TEMP/upmore-parser-venv/bin" >> "$GITHUB_PATH"
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/career/critical-repairs
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/career/interview-journey
      - name: Domain, registry, router, gauntlet grader, UI, secret scan
        run: node scripts/career/critical-repairs/ci-node.cjs
      - name: Inventory original archival release prerequisites (missing assets remain NOT_RUN)
        if: always()
        run: node scripts/career/critical-repairs/archive-gate.cjs --inventory
      - name: Generated files are current
        if: always()
        run: |
          python3 scripts/build-router-core.py --check
          python3 scripts/build-financial-core.py --check
          node scripts/build-connect-cards.cjs --check
          node scripts/build-connector-matrix.cjs --check
          node scripts/build-teardowns.cjs --check
          node scripts/build-methods.cjs --check
          node scripts/build-mutation-report.cjs --check
          python3 scripts/build-standalone-gauntlet.py --check
          node evals/parity/build-matrix.cjs --check
          node scripts/realworld-audit.cjs --check
      - name: Datasets, eval harness, planted mutations
        if: always()
        run: |
          node evals/data/validate.cjs
          node evals/runner.cjs
          node evals/runner.cjs --mutations
      - name: Agent100 dry run (must stay 103/103)
        if: always()
        working-directory: tests/agent100
        run: node harness/runner.js --mode dry --all
      - name: Published interview workflow negative controls (offline contracts only)
        if: always()
        run: node scripts/career/interview-journey/negative-controls.cjs --output "$RUNNER_TEMP/upmore-interview-negative-controls"
      - name: Actual versioned A context consumed by current B (context-only compatibility)
        if: always()
        run: node --experimental-vm-modules scripts/career/interview-journey/projected-context-compatibility.cjs --producer-ref "$GITHUB_SHA"
      - name: Canonical context adapter negative controls (offline contracts only)
        if: always()
        run: node scripts/career/critical-repairs/context-negative-controls.cjs ci-context-controls
  deno:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.9.7 }
      - name: Typed Edge tests (read only both Gmail OAuth source-contract files; no network/env/write permissions)
        run: deno test --allow-read=supabase/functions/gmail-oauth/index.ts,supabase/functions/gmail-oauth/career.ts tests/edge/
      - name: Testing agent (10/10 bar; a single CRITICAL fails the run; the committed report must be current)
        if: always()
        run: deno run -A evals/agent/run.ts --check
      - name: Typecheck shared journey contracts and context adapter
        if: always()
        run: deno check packages/career-contracts/*.ts
      - name: Testing agent self-test (12 planted defects, each must turn its check red)
        if: always()
        run: deno run -A evals/agent/mutations.ts
      - name: Type-check the functions this branch deploys
        if: always()
        run: deno check supabase/functions/career-applicant/index.ts supabase/functions/agent-chat/index.ts supabase/functions/agent-chat/handler-career.ts supabase/functions/model-health/index.ts supabase/functions/agent-proactive/index.ts supabase/functions/broker-oauth-start/index.ts supabase/functions/broker-oauth-callback/index.ts supabase/functions/manual-connect/index.ts supabase/functions/gmail-oauth/career.ts
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Migrations, RLS and SQL tests on a throwaway Postgres 16, plus the migration ledger
        run: PGBIN=/usr/lib/postgresql/16/bin PATH=/usr/lib/postgresql/16/bin:$PATH bash tests/db/run.sh
  archival_release_gate:
    name: Required original archival evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - name: Validate genuine original archives (missing assets block CI and release)
        run: node scripts/career/critical-repairs/archive-gate.cjs --require-complete
