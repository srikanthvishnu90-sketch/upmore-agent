name: brain-eval-live-meter-controls
on:
  push:
    branches: [wo/brain-eval-live-meter-20261021]
    paths:
      - evals/brain-reliability/live-meter.ts
      - evals/brain-reliability/progress.ts
      - tests/brain-eval-live-meter.test.ts
      - .github/workflows/brain-eval-live-meter-controls.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: {deno-version: "v2.9.6"}
      - name: Future meter controls only; no provider or publication access
        run: |
          deno check evals/brain-reliability/live-meter.ts tests/brain-eval-live-meter.test.ts
          deno test --no-check --cached-only --no-remote --deny-net --allow-read --no-prompt tests/brain-eval-live-meter.test.ts
