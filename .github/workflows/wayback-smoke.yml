# TEMPORARY (WO-044): measures the Wayback source alone (anchored filter, 5,000-line pages) without touching any job
# board API. Deleted in WO-044's final commit. GET to web.archive.org only, robots.txt first, one request per 2 s.
name: wayback-smoke
on:
  push:
    branches: [wo/044-discovery-scale]
    paths: [.github/workflows/wayback-smoke.yml]
permissions:
  contents: read
jobs:
  wayback:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - name: Wayback only
        run: |
          mkdir -p out
          deno run -A --no-check scripts/career/discover-boards.ts --phase gather --sources wayback --wb-pages 4 --wb-limit 5000 --max-minutes 25 --out-dir out \
            | tee out/gather.log | grep -E '^(WAYBACK|SOURCES)'
