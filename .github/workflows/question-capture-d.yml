# WO-053 (architect): a fourth, sealed 100-posting sample (D) of real required questions, with each posting's own location,
# Triggered by a change to this file on ci/question-capture-d (a new branch alone did not start it).
# captured where the internet is. On a push to ci/question-capture-d: 40 Greenhouse, 30 Lever and 30 Ashby postings in
# seeded random order (seed 4), no employer from samples A, B or C, the same read-only capture as question-capture.yml
# (Greenhouse's public questions API; Lever and Ashby pages rendered in sandboxed Chromium, nothing clicked or typed).
# Commits evals/apply/questions-ci-d.json to ci/question-capture-d only. Scored once by the architect (coverage and an
# independent review of every fill, the reviewers told each posting's location), never tuned on.
name: question-capture-d
on:
  push:
    branches: [ci/question-capture-d]
    paths:
      - .github/workflows/question-capture-d.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - name: Playwright and the runner's Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund playwright@1.64.1
          echo "UPMORE_PLAYWRIGHT_PATH=$RUNNER_TEMP/tools/node_modules/playwright" >> "$GITHUB_ENV"
          echo "UPMORE_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Pick 100 real postings (seed 4), no employer from samples A, B or C
        run: |
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("evals/apply/questions-ci.json")).postings,b=JSON.parse(fs.readFileSync("evals/apply/questions-ci-b.json")).postings,c=JSON.parse(fs.readFileSync("evals/apply/questions-ci-c.json")).postings;fs.writeFileSync(process.argv[1],JSON.stringify({postings:[...a,...b,...c].map(p=>({company:p.company}))}))' "$RUNNER_TEMP/exclude.json"
          node scripts/career/pick-form-sources.cjs "$RUNNER_TEMP/d/sources.json" greenhouse=40,lever=30,ashby=30 --seed 4 --exclude "$RUNNER_TEMP/exclude.json"
      - name: Greenhouse questions (public API, one GET each)
        run: node scripts/career/capture-greenhouse-questions.cjs "$RUNNER_TEMP/d/sources.json" "$RUNNER_TEMP/d/gh"
      - name: Lever and Ashby application pages (Chromium, read-only)
        run: |
          node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync(process.argv[1]));fs.writeFileSync(process.argv[2],JSON.stringify(s.filter(x=>x.family!=="greenhouse")))' "$RUNNER_TEMP/d/sources.json" "$RUNNER_TEMP/d/render-sources.json"
          node scripts/career/render-form.cjs "$RUNNER_TEMP/d/render-sources.json" "$RUNNER_TEMP/d/rendered"
      - name: Build the question set
        run: |
          deno run --allow-read --allow-write evals/apply/build-question-set.ts "$RUNNER_TEMP/d/sources.json" "$RUNNER_TEMP/d/gh" "$RUNNER_TEMP/d/rendered" evals/apply/questions-ci-d.json "CI run ${{ github.run_id }} of question-capture-d.yml at ${{ github.sha }}, sample D (seed 4, no employer from A, B or C), sealed and scored once (WO-053)"
      - name: Commit to ci/question-capture-d
        run: |
          git config user.name "question-capture[ci]"
          git config user.email "question-capture@users.noreply.github.com"
          git add evals/apply/questions-ci-d.json
          git commit -m "WO-053 data: sample D, the required questions and locations of 100 more real postings (sealed, scored once)" || exit 0
          git push origin HEAD:ci/question-capture-d
