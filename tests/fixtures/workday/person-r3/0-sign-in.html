<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign In - Northwind Test Traders (TEST Workday-shaped page)</title>
<style>
body { font-family: sans-serif; margin: 24px; }
.test-banner { background: #ffe; border: 1px solid #cc9; padding: 6px; margin-bottom: 12px; }
.css-field { margin: 8px 0; }
.wrap { position: relative; display: inline-block; }
[data-automation-id="click_filter"] { position: absolute; inset: 0; cursor: pointer; }
</style>
</head>
<body>
<!-- WO-048 round 3 TEST page, written by the builder: Workday's sign-in (as signin/0-sign-in.html) with a password rule
     (a digit) and a slow sign-in (about 4 s of "Signing in..."), for the harness's test person. No network. -->
<div class="test-banner" role="note">TEST Workday-shaped page &mdash; synthetic fixture; not a real employer or Workday site</div>
<div data-automation-id="header"><h1>Careers at Northwind Test Traders</h1></div>
<main>
<div data-automation-id="signInContent">
  <h2>Sign In</h2>
  <div data-automation-id="formField-email" class="css-field"><label for="input-4">Email Address<abbr title="required">*</abbr></label>
    <input type="text" id="input-4" data-automation-id="email" autocomplete="off"></div>
  <div data-automation-id="formField-password" class="css-field"><label for="input-5">Password<abbr title="required">*</abbr></label>
    <input type="password" id="input-5" data-automation-id="password" autocomplete="off"></div>
  <input type="text" data-automation-id="beecatcher" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px" value="">
  <div class="wrap"><button type="button" data-automation-id="signInSubmitButton">Sign In</button><div data-automation-id="click_filter" role="button" tabindex="0" aria-label="Sign In"></div></div>
  <p><button type="button" data-automation-id="createAccountLink">Create Account</button> <button type="button" data-automation-id="forgotPasswordLink">Forgot your password?</button></p>
</div>
<div data-automation-id="createAccountContent" hidden>
  <h2>Create Account</h2>
  <div data-automation-id="formField-email" class="css-field"><label for="input-8">Email Address<abbr title="required">*</abbr></label>
    <input type="text" id="input-8" data-automation-id="email" autocomplete="off"></div>
  <div data-automation-id="formField-password" class="css-field"><label for="input-9">Password<abbr title="required">*</abbr></label>
    <input type="password" id="input-9" data-automation-id="password" autocomplete="off"></div>
  <div data-automation-id="formField-verifyPassword" class="css-field"><label for="input-10">Verify New Password<abbr title="required">*</abbr></label>
    <input type="password" id="input-10" data-automation-id="verifyPassword" autocomplete="off"></div>
  <div class="wrap"><button type="button" data-automation-id="createAccountSubmitButton">Create Account</button><div data-automation-id="click_filter" role="button" tabindex="0" aria-label="Create Account"></div></div>
</div>
</main>
<p data-automation-id="errorMessage" role="alert" hidden></p>
<p data-automation-id="signingIn" hidden>Signing in...</p>
<script>
(function () {
  window.__clicks = [];
  document.addEventListener("click", function (e) {
    var t = e.target;
    window.__clicks.push({ id: t.getAttribute("data-automation-id") || t.id || t.tagName, trusted: e.isTrusted });
    var f = t.closest('[data-automation-id="click_filter"]');
    if (!f || f.getAttribute("aria-label") !== "Sign In") return;
    var em = document.getElementById("input-4").value, pw = document.getElementById("input-5").value, err = document.querySelector('[data-automation-id="errorMessage"]');
    if (!em || !pw) { err.textContent = "Email Address and Password are required."; err.hidden = false; return; }
    if (!/\d/.test(pw)) { err.textContent = "Your password must contain at least one number."; err.hidden = false; return; }
    err.hidden = true;
    document.querySelector('[data-automation-id="signingIn"]').hidden = false;
    setTimeout(function () { window.location.href = "1-questions.html"; }, 4000);
  }, true);
})();
</script>
</body>
</html>
