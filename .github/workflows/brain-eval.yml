# WO-061 (owner, 2026-10-21): the chat brain's one bar is 95% or better on the held-out set (evals/career/heldout-live.json),
# one full pass, on the build that is live. Two independent judges score each item (gpt-5-mini and gpt-4.1-mini, both
# OpenAI; no Anthropic spend); an item passes only when both pass it. The router runs beside it on the same set as the
# comparison. Every run adds one line per brain to evals/career/SCORE-LOG.md (date/time, brain commit, set size, score)
# and commits it with the result files to ci/brain-eval. Needs the repository secret OPENAI_API_KEY; without it the run
# prints NOT RUN and fails: a score is never faked. Spend: the runner counts every result file's recorded spend against
# EVAL_BUDGET_USD and stops before the item that would cross it; a stopped run is not a score.
# A measurement commit on ci/brain-eval merges the branch measured as its second parent; that is the brain commit logged.
name: brain-eval
on:
  push:
    branches: [ci/brain-eval]
    paths:
      - .github/workflows/brain-eval.yml
      - evals/career/**
      - supabase/functions/_shared/**
      - supabase/functions/agent-chat/career_brain.ts
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: brain-eval, cancel-in-progress: false }
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CAREER_MODEL: gpt-5-mini
      EVAL_JUDGE_MODEL: gpt-5-mini
      EVAL_JUDGE_MODEL_2: gpt-4.1-mini
      EVAL_BUDGET_USD: "15"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - name: The key is present
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "NOT RUN: the OPENAI_API_KEY secret is not set"; exit 2; fi
      - name: Held-out set, agent brain (the bar)
        run: deno run -A evals/career/run.ts --brain agent --set heldout --label "heldout-agent-${{ github.run_id }}" | tee "$RUNNER_TEMP/h-agent.txt"
      - name: Held-out set, router (the comparison)
        if: always()
        run: deno run -A evals/career/run.ts --brain router --set heldout --label "heldout-router-${{ github.run_id }}" | tee "$RUNNER_TEMP/h-router.txt"
      - name: The score log and the verdict
        if: always()
        run: |
          deno run -A evals/career/score-log.ts evals/career/results/heldout-agent-${{ github.run_id }}.json evals/career/results/heldout-router-${{ github.run_id }}.json --run ${{ github.run_id }}
          deno eval '
            const a = JSON.parse(Deno.readTextFileSync("evals/career/results/heldout-agent-${{ github.run_id }}.json"));
            if (a.stopped) { console.log("WO-061: NOT A SCORE (the run stopped at the spend cap)"); Deno.exit(0); }
            console.log(`WO-061: held-out agent ${a.passed}/${a.total} (${(a.pass_rate * 100).toFixed(1)}%), two judges, brain ${a.source_commit}: ${a.pass_rate >= 0.95 ? "AT THE BAR (95%); live only once this exact build is deployed" : "BELOW THE BAR (95%)"}`);
          ' | tee "$RUNNER_TEMP/verdict.txt"
      - name: Commit the results to ci/brain-eval
        if: always()
        run: |
          git config user.name "brain-eval[ci]"
          git config user.email "brain-eval@users.noreply.github.com"
          git add evals/career/results/ evals/career/SCORE-LOG.md || true
          git commit -m "WO-061 data: held-out eval, run ${{ github.run_id }} ($(tail -1 "$RUNNER_TEMP/verdict.txt" 2>/dev/null))" || exit 0
          git push origin HEAD:ci/brain-eval
