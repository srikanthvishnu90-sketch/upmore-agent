<!doctype html><html><head><meta charset="utf-8"><title>Job Application for Software Engineer at Acme Robotics (TEST fixture)</title>
<style>body{font:15px system-ui;max-width:680px;margin:20px auto}label,legend{font-weight:600;display:block;margin:12px 0 4px}input[type=text],input[type=tel],input[type=email],textarea,select{width:100%;padding:7px;box-sizing:border-box}.select-shell{position:relative;border:1px solid #888;padding:6px}.select__menu{position:absolute;left:0;right:0;border:1px solid #888;z-index:5;max-height:180px;overflow:auto}.select__input{border:0}</style></head><body>
<p>TEST FIXTURE modeled on a Greenhouse job-board application (not a real employer)</p>
<form id="application-form" method="get" action="/acme/jobs/1001"><div class="application--questions">
<div class="field-wrapper"><label id="first_name-label" for="first_name">First Name<span aria-hidden="true">*</span></label><input id="first_name" type="text" aria-required="true"></div>
<div class="field-wrapper"><label for="last_name">Last Name<span aria-hidden="true">*</span></label><input id="last_name" type="text" aria-required="true"></div>
<div class="field-wrapper"><label for="preferred_name">Preferred First Name</label><input id="preferred_name" type="text"></div>
<div class="field-wrapper"><label for="email">Email<span aria-hidden="true">*</span></label><input id="email" type="text" aria-required="true"></div>
<fieldset class="phone-input"><legend class="visually-hidden">Phone</legend>
 <div class="select__container"><label id="country-label" for="country" class="select__label">Country<span aria-hidden="true">*</span></label>
 <div class="select-shell" data-combobox='["United States","Canada","India","United Kingdom"]'><div class="select__control"><div class="select__value-container"><input id="country" role="combobox" class="select__input" type="text" aria-required="true" aria-labelledby="country-label" autocomplete="off"></div></div></div></div>
 <label for="phone">Phone</label><input id="phone" type="tel"></fieldset>
<div class="field-wrapper"><label id="resume-label">Resume/CV<span aria-hidden="true">*</span></label><button type="button">Attach</button><input id="resume" type="file" style="display:none" aria-required="true" aria-labelledby="resume-label"></div>
<div class="field-wrapper"><label id="cover-label">Cover Letter</label><button type="button">Attach</button><input id="cover_letter" type="file" style="display:none" aria-labelledby="cover-label"></div>
<div class="field-wrapper"><label for="linkedin">LinkedIn Profile</label><input id="linkedin" type="text"></div>
<div class="field-wrapper"><label for="q_why">Why do you want to work at Acme?<span aria-hidden="true">*</span></label><textarea id="q_why" aria-required="true"></textarea></div>
<div class="select__container"><label id="q_auth-label" for="q_auth" class="select__label">Are you legally authorized to work in the United States?<span aria-hidden="true">*</span></label>
 <div class="select-shell" data-combobox='["Yes, I am authorized to work","No, I need work authorization"]'><div class="select__control"><div class="select__value-container"><input id="q_auth" role="combobox" class="select__input" type="text" aria-required="true" aria-labelledby="q_auth-label" autocomplete="off"></div></div></div></div>
<div class="field-wrapper"><label for="q_hear">How did you hear about this job?</label><select id="q_hear"><option value="">Select...</option><option value="a">Job board</option><option value="b">Referral</option><option value="c">Other</option></select></div>
<fieldset><legend>Which languages do you use at work? (select all that apply)</legend>
 <div><input type="checkbox" id="lang_py"><label for="lang_py" style="display:inline">Python</label></div><div><input type="checkbox" id="lang_ts"><label for="lang_ts" style="display:inline">TypeScript</label></div><div><input type="checkbox" id="lang_go"><label for="lang_go" style="display:inline">Go</label></div></fieldset>
<div><input type="checkbox" id="privacy" aria-required="true"><label for="privacy" style="display:inline">I acknowledge the privacy notice<span aria-hidden="true">*</span></label></div>
<div class="eeoc__container"><h2>Voluntary Self-Identification</h2>
 <div class="select__container"><label id="gender-label" for="gender" class="select__label">Gender</label><div class="select-shell" data-combobox='["Male","Female","Non-binary","Decline to self-identify"]'><div class="select__control"><div class="select__value-container"><input id="gender" role="combobox" class="select__input" type="text" aria-labelledby="gender-label" autocomplete="off"></div></div></div></div>
 <div class="select__container"><label id="vet-label" for="vet" class="select__label">Veteran Status</label><div class="select-shell" data-combobox='["I am a protected veteran","I am not a protected veteran","I do not wish to answer"]'><div class="select__control"><div class="select__value-container"><input id="vet" role="combobox" class="select__input" type="text" aria-labelledby="vet-label" autocomplete="off"></div></div></div></div>
 <fieldset><legend>Disability Status</legend><div><input type="radio" name="dis" id="d1"><label for="d1" style="display:inline">Yes, I have a disability</label></div><div><input type="radio" name="dis" id="d2"><label for="d2" style="display:inline">No, I do not have a disability</label></div><div><input type="radio" name="dis" id="d3"><label for="d3" style="display:inline">I do not want to answer</label></div></fieldset></div>
</div><button type="submit">Submit application</button></form><script src="/widgets.js"></script></body></html>
