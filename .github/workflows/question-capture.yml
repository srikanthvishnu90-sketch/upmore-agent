# WO-009b-6 data (architect): the real required questions of 100 real postings, captured where the internet is (CI).
# On a push to ci/question-capture: picks 40 Greenhouse, 30 Lever and 30 Ashby postings from the board directory (one per
# employer), fetches Greenhouse's public questions API once each, renders the Lever and Ashby application pages in
# sandboxed Chromium (GETs and GraphQL queries only; nothing clicked or typed), builds evals/apply/questions-ci.json,
# measures docs/apply/ask-once.md with the product's own classifier, and commits both to ci/question-capture only.
name: question-capture
on:
  push:
    branches: [ci/question-capture]
    paths:
      - scripts/career/pick-form-sources.cjs
      - scripts/career/render-form.cjs
      - scripts/career/capture-greenhouse-questions.cjs
      - evals/apply/build-question-set.ts
      - evals/apply/ask-once.ts
      - .github/workflows/question-capture.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - name: Playwright and the runner's Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund playwright@1.64.1
          echo "UPMORE_PLAYWRIGHT_PATH=$RUNNER_TEMP/tools/node_modules/playwright" >> "$GITHUB_ENV"
          echo "UPMORE_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Pick 100 real postings
        run: node scripts/career/pick-form-sources.cjs "$RUNNER_TEMP/sources.json" greenhouse=40,lever=30,ashby=30
      - name: Greenhouse questions (public API, one GET each)
        run: node scripts/career/capture-greenhouse-questions.cjs "$RUNNER_TEMP/sources.json" "$RUNNER_TEMP/gh"
      - name: Lever and Ashby application pages (Chromium, read-only)
        run: |
          node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync(process.argv[1]));fs.writeFileSync(process.argv[2],JSON.stringify(s.filter(x=>x.family!=="greenhouse")))' "$RUNNER_TEMP/sources.json" "$RUNNER_TEMP/render-sources.json"
          node scripts/career/render-form.cjs "$RUNNER_TEMP/render-sources.json" "$RUNNER_TEMP/rendered"
      - name: Build the question set and measure ask-once
        run: |
          deno run --allow-read --allow-write evals/apply/build-question-set.ts "$RUNNER_TEMP/sources.json" "$RUNNER_TEMP/gh" "$RUNNER_TEMP/rendered" evals/apply/questions-ci.json "CI run ${{ github.run_id }} of question-capture.yml at ${{ github.sha }}"
          deno run --allow-read --allow-write evals/apply/ask-once.ts evals/apply/questions-ci.json docs/apply/ask-once.md
      - name: Commit to ci/question-capture
        run: |
          git config user.name "question-capture[ci]"
          git config user.email "question-capture@users.noreply.github.com"
          git add evals/apply/questions-ci.json docs/apply/ask-once.md
          git commit -m "WO-009b-6 data: required questions of 100 real postings, and the ask-once measure" || exit 0
          git push origin HEAD:ci/question-capture
