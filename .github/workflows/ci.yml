name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    # The gate took 9.3-9.6 min on #62 (2026-10-20), its career-and-shared step alone 520-537 s; at 10 the next test
    # cancelled it (5470fe98). Headroom, not a target: a slower gate is still a finding.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - name: Install tooling and use the runner's packaged Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/wo001-tools" --no-audit --no-fund playwright@1.64.1 esbuild@0.25.12
          # WO-031: an unpacked extension loads only in Chromium (branded Chrome ignores --load-extension); the extension
          # suite (tests/career-extension-browser.test.cjs) finds Playwright's own Chromium through UPMORE_PLAYWRIGHT_PATH.
          (cd "$RUNNER_TEMP/wo001-tools" && npx --no-install playwright install chromium)
          browser_path=$(command -v google-chrome)
          test -x "$browser_path"
          echo "UPMORE_PLAYWRIGHT_PATH=$RUNNER_TEMP/wo001-tools/node_modules/playwright" >> "$GITHUB_ENV"
          echo "UPMORE_CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
          echo "ESBUILD_BIN=$RUNNER_TEMP/wo001-tools/node_modules/.bin/esbuild" >> "$GITHUB_ENV"
          # The pay-data importer tests read a real .xlsx (WO-036); a venv keeps the runner's system Python untouched.
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet openpyxl==3.1.5
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: Allow sandboxed Chromium user namespaces for this gate job
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Fail-first regression evidence
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$BRANCH_NAME" == trunk || "$BRANCH_NAME" == "$DEFAULT_BRANCH" ]] && [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$BEFORE_SHA"
          elif git show-ref --verify --quiet refs/remotes/origin/trunk; then
            # Work orders target trunk; PR events above always use their actual target.
            base=origin/trunk
          else
            base="origin/$DEFAULT_BRANCH"
          fi
          python3 scripts/check-fail-first.py --base "$base" --head "$TEST_HEAD_SHA" --report "$RUNNER_TEMP/fail-first.json"
      - name: Career gate
        run: bash scripts/gate.sh
      - name: Retain fail-first evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fail-first-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fail-first.json
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Migrations, RLS and SQL tests on a throwaway Postgres 16, plus the migration ledger
        run: PGBIN=/usr/lib/postgresql/16/bin PATH=/usr/lib/postgresql/16/bin:$PATH bash tests/db/run.sh
