  <meta name="description" content="ABOUT AIRWALLEX

Airwallex is the AI-native financial operating system for a real-time, intelligent economy. More than 675,000 businesses, including McLaren Racing, Qantas, SHEIN, and TikTok, use us, directly or through our platform partners, to run their financial operations or build and monetize financial products of their own.

We started in Melbourne in 2015 to build the infrastructure global commerce runs on. We&#39;re the regulated backbone behind global payments: not by accident, but by design. A decade plus, 85+ licenses, and a financial infrastructure spanning North America, Europe, the Middle East, and Asia-Pacific.

We&#39;re co-headquartered in San Francisco and Singapore, with more than 2,300 people across 27 offices. We hire builders with founder-level energy, people who move fast with good judgment, dig in with real curiosity, and make calls from first principles rather than waiting to be told what to do. Read our operating principles https://www.airwallex.com/en-us/operating-principles to see it in full.

 


ABOUT THE TEAM

The Merchant Services team partners with our clients to realise their full potential through the adoption of Airwallex products that drive their growth and success. We influence revenue growth across our entire product portfolio and collaborate with sales, strategy, product, and engineering teams to provide the best experience for our most valued customers. Our team works alongside commercial teams throughout the pre-sales, integration, and post go-live ramping stages, serving as the single technical point of contact and trusted advisor for our clients. We are committed to empowering businesses with the tools our clients need to succeed in a dynamic market.


WHAT YOU’LL DO

As a Technical Account Manager (TAM) in Airwallex, you will play a crucial role in fostering our customers’ innovative and transformative endeavours across our full payment solutions suites. This is not a sales role, instead, it offers you the opportunity to serve as the primary technical advisor and ‘voice of the customer’ for our most valued enterprise customers.

Within the Merchant Services team, TAMs contribute significantly to ensuring the success of key enterprise customers in optimising their adoption and integration of Airwallex products. Serving as a strategic expert, TAMs offer guidance on the entire suite of Airwallex products and the customer’s architecture. This support extends to addressing strategy-related queries, aiding in project and launch planning, and resolving operational challenges. TAMs actively engage at the account level, providing recommendations and proactive advice throughout the post go-live ramping experiences. Additionally, TAMs work cross-functionally across internal Airwallex teams and provide an elevated support experience for our strategic clients


RESPONSIBILITIES:

 - Be the primary technical owner dedicated to a group of Airwallex strategic enterprise clients

 - Deliver an elevated services and technical support experience to your client portfolios

 - Build trusted relationships with your clients by becoming a subject matter expert on their business

 - Work with account managers from commercial team to explore optimization and upsell opportunities

 - Be directly accountable for analysing and improving their support experience and providing contextual insight regarding client’s experience with Airwallex products

 - Serve as an escalation point to provide break-fix support and for ad-hoc technical questions from the clients

 - Support the Quarterly Business Review (QBR) sessions held with the clients, especially on Airwallex product roadmap updates and technical support / performance metrics walkthroughs


WHO YOU ARE

We are looking for a technically savvy and sales-oriented technical account manager to partner with our most strategic enterprise customers, guiding them through post-sales queries and highlighting opportunities to scale to maximize the value of what they can build with our products. We’re looking for people who meet the minimum qualifications for this role. The preferred qualifications are great to have, but are not mandatory.


MINIMUM QUALIFICATIONS:

 - Bachelor’s degree in a STEM discipline, with strong academic achievements

 - At least 5 years experience working in an engineering, technical support, or technical account manager role

 - Comfortable managing multiple and changing priorities and meeting deadlines in an entrepreneurial environment

 - Ability to approach customer and sales team requests in a proactive and consultative manner; listen and understand user requests and needs and effectively deliver

 - Thorough understanding of the software development lifecycle and API architecture

 - Proficiency in professional oral and written communication, with a record of presenting to audiences containing one or more decision-makers


PREFERRED QUALIFICATIONS:

 - Knowledge of the payments domain / financial services will be advantageous

 - Experience working with data. You can analyze transaction patterns and use these insights to drive improvements and optimizations

 - Strong organizational skills and self-starting mindset

 - Experience integrating RESTful APIs into web applications


APPLICANT SAFETY POLICY: FRAUD AND THIRD-PARTY RECRUITERS

To protect you from recruitment scams, please be aware that Airwallex will not ask for bank details, sensitive ID numbers (i.e. passport), or any form of payment during the application or interview process. All official communication will come from an @airwallex.com http://airwallex.com email address. Please apply only through careers.airwallex.com http://careers.airwallex.com or our official LinkedIn page.

Airwallex does not accept unsolicited resumes from search firms/recruiters.  Airwallex will not pay any fees to search firms/recruiters if a candidate is submitted by a search firm/recruiter unless an agreement has been entered into with respect to specific open position(s).  Search firms/recruiters submitting resumes to Airwallex on an unsolicited basis shall be deemed to accept this condition, regardless of any other provision to the contrary.


EQUAL OPPORTUNITY

Airwallex is proud to be an equal opportunity employer. We value diversity and anyone seeking employment at Airwallex is considered based on merit, qualifications, competence and talent. We don’t regard color, religion, race, national origin, sexual orientation, ancestry, citizenship, sex, marital or family status, disability, gender, or any other legally protected status when making our hiring decisions. If you have a disability or special need that requires accommodation, please let us know." />

al commerce runs on. We're the regulated backbone behind global payments: not by accident, but by design. A decade plus, 85+ licenses, and a financial infrastructure spanning North America, Europe, the Middle East, and Asia-Pacific.</p><p style=\"min-height:1.5em\">We're co-headquartered in San Francisco and Singapore, with more than 2,300 people across 27 offices. We hire builders with founder-level energy, people who move fast with good judgment, dig in with real curiosity, and make calls from first principles rather than waiting to be told what to do. Read our<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.airwallex.com/en-us/operating-principles\"> <u>operating principles</u></a> to see it in full.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>About the team</strong></h2><p style=\"min-height:1.5em\">The Merchant Services team partners with our clients to realise their full potential through the adoption of Airwallex products that drive their growth and success. We influence revenue growth across our entire product portfolio and collaborate with sales, strategy, product, and engineering teams to provide the best experience for our most valued customers. Our team works alongside commercial teams throughout the pre-sales, integration, and post go-live ramping stages, serving as the single technical point of contact and trusted advisor for our clients. We are committed to empowering businesses with the tools our clients need to succeed in a dynamic market.</p><p style=\"min-height:1.5em\"></p><h2><strong>What you’ll do</strong></h2><p style=\"min-height:1.5em\">As a Technical Account Manager (TAM) in Airwallex, you will play a crucial role in fostering our customers’ innovative and transformative endeavours across our full payment solutions suites. This is not a sales role, instead, it offers you the opportunity to serve as the primary technical advisor and ‘voice of the customer’ for our most valued enterprise customers.</p><p style=\"min-height:1.5em\">Within the Merchant Services team, TAMs contribute significantly to ensuring the success of key enterprise customers in optimising their adoption and integration of Airwallex products. Serving as a strategic expert, TAMs offer guidance on the entire suite of Airwallex products and the customer’s architecture. This support extends to addressing strategy-related queries, aiding in project and launch planning, and resolving operational challenges. TAMs actively engage at the account level, providing recommendations and proactive advice throughout the post go-live ramping experiences. Additionally, TAMs work cross-functionally across internal Airwallex teams and provide an elevated support experience for our strategic clients</p><p style=\"min-height:1.5em\"></p><h3><strong>Responsibilities:</strong></h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Be the primary technical owner dedicated to a group of Airwallex strategic enterprise clients</p></li><li><p style=\"min-height:1.5em\">Deliver an elevated services and technical support experience to your client portfolios</p></li><li><p style=\"min-height:1.5em\">Build trusted relationships with your clients by becoming a subject matter expert on their business</p></li><li><p style=\"min-height:1.5em\">Work with account managers from commercial team to explore optimization and upsell opportunities</p></li><li><p style=\"min-height:1.5em\">Be directly accountable for analysing and improving their support experience and providing contextual insight regarding client’s experience with Airwallex products</p></li><li><p style=\"min-height:1.5em\">Serve as an escalation point to provide break-fix support and for ad-hoc technical questions from the clients</p></li><li><p style=\"min-height:1.5em\">Support the Quarterly Business Review (QBR) sessions held with the clients, especially on Airwallex product roadmap updates and technical support / performance metrics walkthroughs</p></li></ul><h2><strong>Who you are</strong></h2><p style=\"min-height:1.5em\">We are looking for a technically savvy and sales-oriented technical account manager to partner with our most strategic enterprise customers, guiding them through post-sales queries and highlighting opportunities to scale to maximize the value of what they can build with our products. We’re looking for people who meet the minimum qualifications for this role. The preferred qualifications are great to have, but are not mandatory.</p><p style=\"min-height:1.5em\"></p><h3><strong>Minimum qualifications:</strong></h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Bachelor’s degree in a STEM discipline, with strong academic achievements</p></li><li><p style=\"min-height:1.5em\">At least 5 years experience working in an engineering, technical support, or technical account manager role</p></li><li><p style=\"min-height:1.5em\">Comfortable managing multiple and changing priorities and meeting deadlines in an entrepreneurial environment</p></li><li><p style=\"min-height:1.5em\">Ability to approach customer and sales team requests in a proactive and consultative manner; listen and understand user requests and needs and effectively deliver</p></li><li><p style=\"min-height:1.5em\">Thorough understanding of the software development lifecycle and API architecture</p></li><li><p style=\"min-height:1.5em\">Proficiency in professional oral and written communication, with a record of presenting to audiences containing one or more decision-makers</p></li></ul><h3><strong>Preferred qualifications:</strong></h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Knowledge of the payments domain / financial services will be advantageous</p></li><li><p style=\"min-height:1.5em\">Experience working with data. You can analyze transaction patterns and use these insights to drive improvements and optimizations</p></li><li><p style=\"min-height:1.5em\">Strong organizational skills and self-starting mindset</p></li><li><p style=\"min-height:1.5em\">Experience integrating RESTful APIs into web applications</p></li></ul><h2><strong>Applicant Safety Policy: Fraud and Third-Party Recruiters</strong></h2><p style=\"min-height:1.5em\"><em>To protect you from recruitment scams, please be aware that Airwallex will not ask for bank details, sensitive ID numbers (i.e. passport), or any form of payment during the application or interview process. All official communication will come from an @</em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://airwallex.com\"><em>airwallex.com</em></a><em> email address. Please apply only through </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://careers.airwallex.com\"><em><u>careers.airwallex.com</u></em></a><em> or our official LinkedIn page.</em></p><p style=\"min-height:1.5em\"><em>Airwallex does not accept unsolicited resumes from search firms/recruiters.  Airwallex will not pay any fees to search firms/recruiters if a candidate is submitted by a search firm/recruiter unless an agreement has been entered into with respect to specific open position(s).  Search firms/recruiters submitting resumes to Airwallex on an unsolicited basis shall be deemed to accept this condition, regardless of any other provision to the contrary.</em></p><p style=\"min-height:1.5em\"></p><h2><strong>Equal opportunity</strong></h2><p style=\"min-height:1.5em\">Airwallex is proud to be an equal opportunity employer. We value diversity and anyone seeking employment at Airwallex is considered based on merit, qualifications, competence and talent. We don’t regard color, religion, race, national origin, sexual orientation, ancestry, citizenship, sex, marital or family status, disability, gender, or any other legally protected status when making our hiring decisions. If you have a disability or special need that requires accommodation, please let us know.</p>","isListed":true,"isCo
