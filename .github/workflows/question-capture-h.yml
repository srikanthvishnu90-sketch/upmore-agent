# WO-058 (architect): an eighth, sealed 100-posting sample (H) of real required questions, with each posting's own location,
# captured where the internet is. On a push to ci/question-capture-h: 40 Greenhouse, 30 Lever and 30 Ashby postings in
# seeded random order (seed 8), no employer from samples A, B, C, D, E, F or G, the same read-only capture as question-capture.yml
# (Greenhouse's public questions API; Lever and Ashby pages rendered in sandboxed Chromium, nothing clicked or typed).
# Commits evals/apply/questions-ci-h.json to ci/question-capture-h only. Scored once by the architect (coverage and an
# independent review of every fill, the reviewers told each posting's location, rows about pay or work rights kept apart by
# location), never tuned on.
name: question-capture-h
on:
  push:
    branches: [ci/question-capture-h]
    paths:
      - .github/workflows/question-capture-h.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - name: Playwright and the runner's Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund playwright@1.64.1
          echo "UPMORE_PLAYWRIGHT_PATH=$RUNNER_TEMP/tools/node_modules/playwright" >> "$GITHUB_ENV"
          echo "UPMORE_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Pick 100 real postings (seed 8), no employer from samples A, B, C, D, E, F or G
        run: |
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("evals/apply/questions-ci.json")).postings,b=JSON.parse(fs.readFileSync("evals/apply/questions-ci-b.json")).postings,c=JSON.parse(fs.readFileSync("evals/apply/questions-ci-c.json")).postings,d=JSON.parse(fs.readFileSync("evals/apply/questions-ci-d.json")).postings,e=JSON.parse(fs.readFileSync("evals/apply/questions-ci-e.json")).postings,f=JSON.parse(fs.readFileSync("evals/apply/questions-ci-f.json")).postings,g=JSON.parse(fs.readFileSync("evals/apply/questions-ci-g.json")).postings;fs.writeFileSync(process.argv[1],JSON.stringify({postings:[...a,...b,...c,...d,...e,...f,...g].map(p=>({company:p.company}))}))' "$RUNNER_TEMP/exclude.json"
          node scripts/career/pick-form-sources.cjs "$RUNNER_TEMP/h/sources.json" greenhouse=40,lever=30,ashby=30 --seed 8 --exclude "$RUNNER_TEMP/exclude.json"
      - name: Greenhouse questions (public API, one GET each)
        run: node scripts/career/capture-greenhouse-questions.cjs "$RUNNER_TEMP/h/sources.json" "$RUNNER_TEMP/h/gh"
      - name: Lever and Ashby application pages (Chromium, read-only)
        run: |
          node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync(process.argv[1]));fs.writeFileSync(process.argv[2],JSON.stringify(s.filter(x=>x.family!=="greenhouse")))' "$RUNNER_TEMP/h/sources.json" "$RUNNER_TEMP/h/render-sources.json"
          node scripts/career/render-form.cjs "$RUNNER_TEMP/h/render-sources.json" "$RUNNER_TEMP/h/rendered"
      - name: Build the question set
        run: |
          deno run --allow-read --allow-write evals/apply/build-question-set.ts "$RUNNER_TEMP/h/sources.json" "$RUNNER_TEMP/h/gh" "$RUNNER_TEMP/h/rendered" evals/apply/questions-ci-h.json "CI run ${{ github.run_id }} of question-capture-h.yml at ${{ github.sha }}, sample H (seed 8, no employer from A, B, C, D, E, F or G), sealed and scored once (WO-058)"
      - name: Commit to ci/question-capture-h
        run: |
          git config user.name "question-capture[ci]"
          git config user.email "question-capture@users.noreply.github.com"
          git add evals/apply/questions-ci-h.json
          git commit -m "WO-058 data: sample H, the required questions and locations of 100 more real postings (sealed, scored once)" || exit 0
          git push origin HEAD:ci/question-capture-h
