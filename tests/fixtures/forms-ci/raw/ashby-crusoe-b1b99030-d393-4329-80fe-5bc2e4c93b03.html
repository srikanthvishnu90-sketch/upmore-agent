    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Staff Product Security Engineer","description":"<p style=\"min-height:1.5em\">Crusoe is on a mission <em>to accelerate the abundance of energy and intelligence</em>. As the only vertically integrated AI infrastructure company built from the ground up, we own and operate each layer of the stack — from electrons to tokens — to power the world's most ambitious AI workloads. When you join Crusoe, you join a team that is building the future, faster.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">We're in the midst of the greatest industrial revolution of our time. The demand for AI compute is boundless, and power is a bottleneck. We're solving that — with an energy-first approach that makes AI infrastructure better for the world and faster for the people innovating with AI.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">We're looking for problem-solving, opportunity-finding teammates with a sense of urgency, who believe in the scale of our ambition and thrive on a path not fully paved — people who want to grow their careers alongside a team of experts across energy, manufacturing, data center construction, and cloud services.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">If you want to do the most meaningful work of your career, help our customers and partners advance their AI strategies, and be part of a high-performing team that believes in each other, come build with us at Crusoe.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>About This Role</strong></p><p style=\"min-height:1.5em\">We’re seeking a Staff Product Security Engineer with deep AI/ML security expertise to strengthen Crusoe’s security posture across applications, infrastructure, and distributed AI systems. This is a highly technical role focused on advanced penetration testing, AI/ML attack surface research, and building secure-by-design guardrails that engineering teams rely on.</p><p style=\"min-height:1.5em\">You’ll operate at the intersection of offensive security, AI systems, and production engineering; owning security outcomes end-to-end while influencing system design across the organization.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What You’ll Be Working On</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Performing advanced manual penetration testing across complex applications, infrastructure, Kubernetes environments, and distributed microservice ecosystems</p></li><li><p style=\"min-height:1.5em\">Leading offensive security initiatives including red team operations, adversary simulation, and security research</p></li><li><p style=\"min-height:1.5em\">Securing AI/ML systems end-to-end, including LLM pipelines, vector databases, RAG architectures, and agentic workflows</p></li><li><p style=\"min-height:1.5em\">Identifying and researching novel attack surfaces unique to LLMs and autonomous systems, contributing to internal and external AI security research</p></li><li><p style=\"min-height:1.5em\">Influencing secure system design across the SDLC, embedding security into CI/CD pipelines, container images, and deployment workflows</p></li><li><p style=\"min-height:1.5em\">Integrating and operationalizing security tooling (SAST, DAST, SCA, container scanning) and driving remediation of complex application-layer vulnerabilities</p></li><li><p style=\"min-height:1.5em\">Building internal security guardrails such as hardened base images, reusable libraries, and policy-as-code frameworks</p></li><li><p style=\"min-height:1.5em\">Developing production-grade security tooling and leading cross-functional security programs from design through deployment</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What You’ll Bring to the Team</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">8-10 years of deep hands-on experience in offensive security, including manual penetration testing, red team operations, and adversary simulation</p></li><li><p style=\"min-height:1.5em\">Familiarity with modern C2 frameworks (e.g., Cobalt Strike, Sliver, Havoc), exploit development, and security research</p></li><li><p style=\"min-height:1.5em\">Strong expertise across the AI/ML stack, including MLOps, inference architectures, vector databases, RAG, and agentic frameworks (e.g., ReAct, Reflexion)</p></li><li><p style=\"min-height:1.5em\">Experience building, deploying, and securing LLM pipelines and AI workflows in Kubernetes and/or bare-metal environments</p></li><li><p style=\"min-height:1.5em\">Strong software engineering foundations with experience shipping production code in Go, Python, or Rust</p></li><li><p style=\"min-height:1.5em\">Hands-on experience securing Kubernetes, containers, VMs, and CI/CD environments</p></li><li><p style=\"min-height:1.5em\">Deep understanding of application security vulnerabilities, secure coding practices, and distributed system design</p></li><li><p style=\"min-height:1.5em\">Demonstrated ability to lead complex, cross-functional security initiatives end-to-end</p></li><li><p style=\"min-height:1.5em\">Strong communication skills with the ability to influence both engineering teams and executive stakeholders</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Bonus Points</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Public contributions to offensive security or AI security research (talks, blogs, tooling, CVEs, etc.)</p></li><li><p style=\"min-height:1.5em\">Experience building internal red team or adversary simulation programs</p></li><li><p style=\"min-height:1.5em\">Background in high-performance computing, AI infrastructure, or cloud-native platform security</p></li><li><p style=\"min-height:1.5em\">Experience designing policy-as-code frameworks at scale</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Benefits:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Competitive compensation</p></li><li><p style=\"min-height:1.5em\">Restricted Stock Units</p></li><li><p style=\"min-height:1.5em\">Paid time off &amp; paid holidays</p></li><li><p style=\"min-height:1.5em\">Comprehensive health, dental &amp; vision insurance</p></li><li><p style=\"min-height:1.5em\">Employer contributions to HSA account</p></li><li><p style=\"min-height:1.5em\">Paid parental leave</p></li><li><p style=\"min-height:1.5em\">Paid life insurance, short-term and long-term disability</p></li><li><p style=\"min-height:1.5em\">Professional development &amp; tuition reimbursement</p></li><li><p style=\"min-height:1.5em\">Mental health &amp; wellness support</p></li><li><p style=\"min-height:1.5em\">Commuter benefits (parking &amp; transit)</p></li><li><p style=\"min-height:1.5em\">Cell phone stipend</p></li><li><p style=\"min-height:1.5em\">401(k) Retirement plan with company match up to 4% of salary</p></li><li><p style=\"min-height:1.5em\">Volunteer time off</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Compensation Range</strong></p><p style=\"min-height:1.5em\">Compensation will be paid in the range of up to $250,000 - $285,000 + Bonus. Restricted Stock Units are included in all offers. Compensation to be determined by the applicants knowledge, education, and abilities, as well as internal equity and alignment with market data.</p><p style=\"min-height:1.5em\">Crusoe is an Equal Opportunity Employer. Employment decisions are made without regard to race, color, religion, disability, genetic information, pregnancy, citizenship, marital status, sex/gender, sexual preference/ orientation, gender identity, age, veteran status, national origin, or any other status protected by law or regulation.</p>","directApply":true,"identifier":{
