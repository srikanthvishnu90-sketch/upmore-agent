# WO-061 (owner, 2026-10-21; D-030): the chat brain's one bar is 95% or better on the held-out set (evals/career/heldout-live.json),
# one full pass, on the build that is live. Judges: gpt-5-mini and gpt-4.1-mini here (OpenAI; no Anthropic spend), an item
# passing in CI only when both pass it, and Instinct, the owner-appointed second judge, who scores every run beside them
# into evals/career/instinct/<run>.json (evals/career/both-pass.ts). The router runs beside the agent on the same set as
# the comparison. Every run adds one line per pass to evals/career/SCORE-LOG.md (date/time, brain commit, set size, score)
# and commits it with the result files to ci/brain-eval. Needs the repository secret OPENAI_API_KEY; without it the run
# prints NOT RUN and fails: a score is never faked. Spend: the runner counts every result file's recorded spend against
# EVAL_BUDGET_USD and stops before the item that would cross it; a stopped run is not a score.
# A measurement commit on ci/brain-eval merges the branch measured as its second parent; that is the brain commit logged.
# 2026-10-26 (sealed held-out set): what a run measures is read from evals/career/eval-request.json (a push) or the
# dispatch inputs: the set (dev: the 38 the builder has seen; sealed: the bar), the brains (router, staged, agent) and the
# passes. The verdict (evals/career/verdict.ts) fails the job when any pass is not a score (stopped, a brain error, or a
# CI judge that did not score every item) and, on the sealed set, when no brain clears 95% on every one of its five
# passes. The sealed set is opened only here, into the runner's temp directory, and its results keep no item text.
name: brain-eval
on:
  push:
    branches: [ci/brain-eval]
    paths:
      - .github/workflows/brain-eval.yml
      - evals/career/**
      - supabase/functions/_shared/**
      - supabase/functions/agent-chat/career_brain.ts
      - supabase/functions/agent-chat/career_staged.ts
  workflow_dispatch:
    inputs:
      set:
        description: "dev (the 38, a development set) or sealed (the bar; once per sealed hash)"
        type: choice
        options: [dev, sealed]
        default: dev
      brains:
        description: "Comma-separated: router, staged, agent"
        type: string
        default: "router,staged,agent"
      allow_sealed_rerun:
        description: "Owner only: run the sealed set again although this hash was already run (RUNS.json)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: { group: brain-eval, cancel-in-progress: false }
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CAREER_MODEL: gpt-5-mini
      EVAL_JUDGE_MODEL: gpt-5-mini
      # Owner, 2026-10-21: "gpt-4.1-mini judges every run from now on ... A judge that runs only sometimes makes runs
      # incomparable." In CI an item passes only when both pass it; Instinct scores every run beside them.
      EVAL_JUDGE_MODEL_2: gpt-4.1-mini
      # OWNER'S RULING (2026-10-21, later): "Eval spend ceiling is now $15 total tonight ($4.57 used so far)."
      # BUILDER'S ARITHMETIC (not an owner figure): this limit sums every recorded result file since the eval began,
      # so it is set to (recorded spend before tonight, $1.535) + $15 = $16.535, and written lower ($15.95) because five
      # passes run in parallel and each sees only the spend recorded before it started: four others (about $0.12 each)
      # can land beside the one that reaches the limit. Builder's arithmetic, not an owner figure. Ledger: evals/career/ROOT-CAUSES.md, "EVAL SPEND LEDGER".
      # OWNER'S RULING (2026-10-25 23:17 CDT, in writing): "$20 more" for this round (brain eval, job judging, resume
      # rewrite). Recorded all-time spend before it: $15.51 (SCORE-LOG close line). Ceiling = 15.51 + 20 = 35.51, written
      # 35.50 for the same parallel-pass margin as above.
      # 2026-10-26: the cap now counts the all-time baseline in evals/career/spend-ledger.json ($15.508 to 2026-10-21 15:10 UTC)
      # plus every result file after it; before, it summed only the result files in the checkout and saw $0 (run
      # 40371458562: spent_before_usd 0). The ceiling itself is the owner's and unchanged.
      EVAL_BUDGET_USD: "35.50"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - name: The key is present
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "NOT RUN: the OPENAI_API_KEY secret is not set"; exit 2; fi
      - name: What this run measures
        id: req
        run: |
          deno eval '
            const f = JSON.parse(Deno.readTextFileSync("evals/career/eval-request.json"));
            const ev = Deno.env.get("GITHUB_EVENT_NAME") === "workflow_dispatch";
            const set = ev ? (Deno.env.get("IN_SET") || "dev") : (f.set ?? "dev");
            const brains = (ev ? (Deno.env.get("IN_BRAINS") || "router,staged,agent").split(",") : (f.brains ?? ["agent"])).map((b) => b.trim()).filter(Boolean);
            const action = ev ? "eval" : (f.action ?? "eval");
            const passes = Number(f.passes ?? 5);
            if (!["dev", "sealed"].includes(set) || !brains.length || brains.some((b) => !["router", "staged", "agent"].includes(b)) || !["eval", "pubkey"].includes(action) || passes !== 5) {
              console.log(`NOT RUN: bad request (set ${set}, brains ${brains}, action ${action}, passes ${passes}; the owner requires five passes)`); Deno.exit(2);
            }
            Deno.writeTextFileSync(Deno.env.get("GITHUB_OUTPUT"), `set=${set}\nbrains=${brains.join(" ")}\nbrains_csv=${brains.join(",")}\naction=${action}\npasses=${passes}\n`, { append: true });
            console.log(`measuring: action ${action}, set ${set}, brains ${brains.join(", ")}, ${passes} passes`);
          '
        env:
          IN_SET: ${{ inputs.set }}
          IN_BRAINS: ${{ inputs.brains }}
      # The sealed set's recipient key: derived from the CI secret, its public half committed so the set can be sealed to
      # it. The secret's value never leaves the runner.
      - name: Recipient key for the sealed set (no model call)
        if: steps.req.outputs.action == 'pubkey'
        run: deno run -A evals/career/sealed/seal.ts pubkey --secret-env OPENAI_API_KEY > evals/career/sealed/recipient.json && cat evals/career/sealed/recipient.json
      - name: Open the sealed set
        if: steps.req.outputs.action == 'eval' && steps.req.outputs.set == 'sealed'
        env:
          HELDOUT_SEAL_KEY: ${{ secrets.HELDOUT_SEAL_KEY }}
        run: |
          deno run -A evals/career/sealed/seal.ts meta evals/career/sealed/heldout-sealed.v1.json
          sha=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("evals/career/sealed/heldout-sealed.v1.json")).sha256)')
          if deno eval "const r = JSON.parse(Deno.readTextFileSync('evals/career/sealed/RUNS.json')); Deno.exit(r.runs.some((x) => x.sha256 === '$sha') ? 0 : 1)" && [ "${{ inputs.allow_sealed_rerun }}" != "true" ]; then
            echo "NOT RUN: the sealed set $sha was already run (evals/career/sealed/RUNS.json); the bar is judged once per set. The owner can re-run it from workflow_dispatch with allow_sealed_rerun."; exit 2
          fi
          deno run -A evals/career/sealed/seal.ts open evals/career/sealed/heldout-sealed.v1.json --out "$RUNNER_TEMP/sealed.json"
          echo "EVAL_SEALED_PATH=$RUNNER_TEMP/sealed.json" >> "$GITHUB_ENV"
          echo "SEALED_SHA=$sha" >> "$GITHUB_ENV"
      # Five full passes of each brain on the same build, in parallel per brain (second judge's ruling, 2026-10-21: the
      # pass-to-pass swing is too large for fewer). Each pass is logged.
      - name: Five passes per brain
        if: steps.req.outputs.action == 'eval'
        run: |
          # --set heldout is the sealed held-out set (the bar); --set dev is the 38 in heldout-live.json.
          if [ "${{ steps.req.outputs.set }}" = "sealed" ]; then S="--set heldout"; else S="--set dev"; fi
          for b in ${{ steps.req.outputs.brains }}; do
            for p in 1 2 3 4 5; do deno run -A evals/career/run.ts --brain "$b" $S --label "${{ steps.req.outputs.set }}-$b-${{ github.run_id }}-p$p" > "$RUNNER_TEMP/$b-$p.txt" 2>&1 & done
            wait
            cat "$RUNNER_TEMP"/$b-*.txt
          done
      - name: Re-score recorded runs (judge only)
        if: steps.req.outputs.action == 'eval'
        run: |
          [ -f evals/career/rejudge.txt ] || exit 0
          grep -v '^[[:space:]]*#' evals/career/rejudge.txt | while read -r l m; do [ -n "$l" ] && deno run -A evals/career/rejudge.ts "$l" "$m"; done
      - name: The score log and the verdict
        id: verdict
        if: always() && steps.req.outputs.action == 'eval'
        run: |
          ls evals/career/results/${{ steps.req.outputs.set }}-*-${{ github.run_id }}-p*.json >/dev/null 2>&1 && deno run -A evals/career/score-log.ts evals/career/results/${{ steps.req.outputs.set }}-*-${{ github.run_id }}-p*.json --run ${{ github.run_id }}
          set +e
          deno run -A evals/career/verdict.ts --run ${{ github.run_id }} --set ${{ steps.req.outputs.set }} --brains ${{ steps.req.outputs.brains_csv }} --passes ${{ steps.req.outputs.passes }} --out "$RUNNER_TEMP/verdict.txt"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/verdict.txt" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.req.outputs.set }}" = "sealed" ]; then
            deno eval 'const f = "evals/career/sealed/RUNS.json", r = JSON.parse(Deno.readTextFileSync(f)); r.runs.push({ sha256: Deno.env.get("SEALED_SHA"), run: Deno.env.get("GITHUB_RUN_ID"), at: new Date().toISOString(), verdict: Deno.readTextFileSync(Deno.env.get("RUNNER_TEMP") + "/verdict.txt").split("\n")[0] }); Deno.writeTextFileSync(f, JSON.stringify(r, null, 1) + "\n");'
          fi
          rm -f "$RUNNER_TEMP/sealed.json"
      - name: Commit the results to ci/brain-eval
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sealed.json"
          git config user.name "brain-eval[ci]"
          git config user.email "brain-eval@users.noreply.github.com"
          git add evals/career/results/ evals/career/SCORE-LOG.md evals/career/sealed/RUNS.json evals/career/sealed/recipient.json || true
          git commit -m "brain-eval data: run ${{ github.run_id }} ($(head -1 "$RUNNER_TEMP/verdict.txt" 2>/dev/null || echo "${{ steps.req.outputs.action }}"))" || exit 0
          git push origin HEAD:ci/brain-eval
      - name: The verdict decides the job
        if: always() && steps.req.outputs.action == 'eval'
        run: |
          cat "$RUNNER_TEMP/verdict.txt" 2>/dev/null || echo "NOT A SCORE: no verdict was written"
          # A second, independent reading of the raw pass files: a claimed bar must hold on every pass (finished, no judge
          # error, both judges on every item, 95% or more), or the job fails whatever verdict.ts said.
          deno eval '
            const set = "${{ steps.req.outputs.set }}", run = "${{ github.run_id }}", v = Deno.readTextFileSync(Deno.env.get("RUNNER_TEMP") + "/verdict.txt");
            for (const b of "${{ steps.req.outputs.brains_csv }}".split(",")) {
              if (!new RegExp(`^${b}: .*BAR MET`, "m").test(v)) continue;
              const ps = [1, 2, 3, 4, 5].map((p) => { try { return JSON.parse(Deno.readTextFileSync(`evals/career/results/${set}-${b}-${run}-p${p}.json`)); } catch { return null; } });
              const clean = (a) => a && !a.stopped && a.total === a.planned && a.items.every((x) => !/^(brain|judge) error/.test(x.note ?? "") && [a.judge_model, a.judge_model_2].every((m) => (x.judges ?? []).some((j) => j.model === m && !/^judge error/.test(j.note ?? ""))));
              if (set !== "sealed" || !ps.every((a) => clean(a) && a.pass_rate >= 0.95)) { console.log(`VERDICT REFUSED: ${b} is not at 95% on every clean pass of the sealed set`); Deno.exit(1); }
            }
          '
          [ "${{ steps.verdict.outputs.code }}" = "0" ]
