# WO-009b-2 unblock (architect): the build sandbox cannot reach job sites, CI can. On a push to ci/form-capture this
# picks 6 real public postings per supported ATS from the board directory, captures each application page the way
# scripts/career/capture-form.cjs does (one GET, raw HTML) and again rendered in sandboxed Chromium (GETs only, nothing
# clicked or typed), prints what each holds, and commits the fixtures back to this branch for WO-009b-2 and 009b-3.
name: form-capture
on:
  push:
    branches: [ci/form-capture]
    paths:
      - scripts/career/pick-form-sources.cjs
      - scripts/career/render-form.cjs
      - scripts/career/capture-form.cjs
      - .github/workflows/form-capture.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - name: Playwright and the runner's Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund playwright@1.64.1
          echo "UPMORE_PLAYWRIGHT_PATH=$RUNNER_TEMP/tools/node_modules/playwright" >> "$GITHUB_ENV"
          echo "UPMORE_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Pick 6 real postings per ATS
        run: rm -rf tests/fixtures/forms-ci && mkdir -p tests/fixtures/forms-ci && node scripts/career/pick-form-sources.cjs tests/fixtures/forms-ci/sources.json 6
      - name: Raw capture (capture-form.cjs, one GET each)
        run: node scripts/career/capture-form.cjs tests/fixtures/forms-ci/sources.json tests/fixtures/forms-ci/raw || true
      - name: Rendered capture (Chromium, GETs only)
        run: node scripts/career/render-form.cjs tests/fixtures/forms-ci/sources.json tests/fixtures/forms-ci/rendered
      - name: Summary
        run: node -e 'const m=require("./tests/fixtures/forms-ci/raw/manifest.json");const t={};for(const f of m.forms)t[f.family+":"+f.status+(f.reason?"("+f.reason+")":"")]=(t[f.family+":"+f.status+(f.reason?"("+f.reason+")":"")]||0)+1;console.log("RAW_TALLY "+JSON.stringify(t))'
      - name: Commit the fixtures to this branch
        run: |
          rm -f tests/fixtures/forms-ci/raw/.capture.lock
          git config user.name "form-capture[ci]"
          git config user.email "form-capture@users.noreply.github.com"
          git add -A tests/fixtures/forms-ci
          git commit -m "WO-009b-2 fixtures: real public application pages captured in CI (raw and rendered)" || exit 0
          git push origin HEAD:ci/form-capture
