# WO-041: are the firm guide's and the interview patterns' sources still there, and which stated dates have passed?
# Runs scripts/career/check-sources.cjs (Node, no dependencies): one request per site at a time, at least 1 second apart,
# robots.txt honored, an honest User-Agent, no cookies, no login, no proxy; LinkedIn and Indeed are never fetched; a bot check is reported,
# never solved. The build sandbox cannot reach these hosts; CI can. The job only reports: it has read-only permission,
# commits nothing and edits no data. A person reads the report and, to use it in the chat, copies it into
# packages/career-data/source-checks.json (see the WO-041 doc).
name: source-freshness
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/source-freshness.yml
      - scripts/career/check-sources.cjs
      - packages/career-data/firm-guide.json
      - packages/career-data/interview-patterns.json
permissions:
  contents: read
concurrency:
  group: source-freshness-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22.23.3" }
      - name: Check every source URL (report only)
        run: |
          node scripts/career/check-sources.cjs \
            --out source-check-report.json \
            --checks-out source-checks.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-check-report
          path: |
            source-check-report.json
            source-checks.json
          retention-days: 30
      - name: Summary
        run: |
          node -e '
            const r = require("./source-check-report.json");
            console.log(`run_at ${r.run_at}; ${r.total} URLs`, JSON.stringify(r.summary));
            console.log(`firm-guide dates past on the run date: ${r.dates_past} of ${r.firm_dates.length}`);
            for (const u of r.urls.filter((x) => x.status !== "live")) console.log(`${u.status} ${u.http_status ?? ""} ${u.url} ${u.note ?? ""}`);
          '
          git status --porcelain -- packages/ && test -z "$(git status --porcelain -- packages/)"
