# Production deploy: the owner's "ship it" is a push to release/production. The job runs in the GitHub environment
# `production` (Settings > Environments > production > Required reviewers: the owner), so nothing runs until he approves
# that run. It ships exactly the pushed commit with scripts/launch/trainee-go-live.sh --sha $GITHUB_SHA --non-interactive
# (docs/launch/TRAINEE-GO-LIVE.md, "From GitHub"): migrations, secrets, deploys, schedules, smoke, and the deploy ledger.
# Every value comes from the environment's secrets; one left unset keeps what the project has (the script's header).
# Nothing here pushes, tags or changes the repo. Rollback: docs/launch/TRAINEE-GO-LIVE.md, "Rollback".
name: deploy-production
on:
  push:
    branches: [release/production]
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    name: deploy (production)
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - uses: supabase/setup-cli@v1
        with: { version: "2.120.0" }
      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version
          supabase --version
          deno --version
      - name: Go live at the pushed commit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CAREER_INGEST_SECRET: ${{ secrets.CAREER_INGEST_SECRET }}
          CAREER_PROACTIVE_SECRET: ${{ secrets.CAREER_PROACTIVE_SECRET }}
          TRAINEE_DELIVER_SECRET: ${{ secrets.TRAINEE_DELIVER_SECRET }}
          TRAINEE_INBOUND_SECRET: ${{ secrets.TRAINEE_INBOUND_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOOPMESSAGE_API_KEY: ${{ secrets.LOOPMESSAGE_API_KEY }}
          INGEST_CONTACT_EMAIL: ${{ secrets.INGEST_CONTACT_EMAIL }}
          TRAINEE_ALLOWED_CONTACTS: ${{ secrets.TRAINEE_ALLOWED_CONTACTS }}
          LOOPMESSAGE_DAILY_CONTACTS: ${{ secrets.LOOPMESSAGE_DAILY_CONTACTS }}
          PDL_API_KEY: ${{ secrets.PDL_API_KEY }}
          UPMORE_TEST_JWT: ${{ secrets.UPMORE_TEST_JWT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_TEMPLATE_UPDATES: ${{ secrets.WHATSAPP_TEMPLATE_UPDATES }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}
          WHATSAPP_DAILY_TEMPLATES: ${{ secrets.WHATSAPP_DAILY_TEMPLATES }}
          # FEATURE 17: the cloud runner (docs/launch/CLOUD-RUNNER.md); each unset one keeps what the project has.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CLOUD_SANDBOX_SNAPSHOT_ID: ${{ secrets.CLOUD_SANDBOX_SNAPSHOT_ID }}
          CLOUD_RUNNER_SECRET: ${{ secrets.CLOUD_RUNNER_SECRET }}
          CLOUD_DISPATCH_SECRET: ${{ secrets.CLOUD_DISPATCH_SECRET }}
          CAREER_PREPARE_AHEAD_TOKEN: ${{ secrets.CAREER_PREPARE_AHEAD_TOKEN }}
          CLOUD_MAX_CONCURRENT: ${{ secrets.CLOUD_MAX_CONCURRENT }}
          CLOUD_MAX_PER_PORTAL: ${{ secrets.CLOUD_MAX_PER_PORTAL }}
          CLOUD_MAX_STARTS_PER_TICK: ${{ secrets.CLOUD_MAX_STARTS_PER_TICK }}
          CLOUD_MAX_PER_PERSON_DAY: ${{ secrets.CLOUD_MAX_PER_PERSON_DAY }}
          CLOUD_MAX_PER_SITE_MINUTE: ${{ secrets.CLOUD_MAX_PER_SITE_MINUTE }}
          CLOUD_PREPARE_MAX_CONCURRENT: ${{ secrets.CLOUD_PREPARE_MAX_CONCURRENT }}
          CLOUD_PREPARE_STARTS_PER_TICK: ${{ secrets.CLOUD_PREPARE_STARTS_PER_TICK }}
          CLOUD_PREPARE_PER_PERSON_DAY: ${{ secrets.CLOUD_PREPARE_PER_PERSON_DAY }}
          CLOUD_PREPARE_PER_SITE_MINUTE: ${{ secrets.CLOUD_PREPARE_PER_SITE_MINUTE }}
          CLOUD_RUNNER_ENABLED: ${{ secrets.CLOUD_RUNNER_ENABLED }}
          CLOUD_PREPARE_ENABLED: ${{ secrets.CLOUD_PREPARE_ENABLED }}
          CAREER_PREPARE_AHEAD_URL: ${{ secrets.CAREER_PREPARE_AHEAD_URL }}
          TRAINEE_GO_LIVE_LOG: ${{ runner.temp }}/go-live/go-live.log
          TRAINEE_DEPLOY_LABEL: github-actions run ${{ github.run_id }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/go-live"
          # The script prints each secret as *** and passes every command's output through its own mask; GitHub masks
          # the secrets above in this log as well.
          bash scripts/launch/trainee-go-live.sh --sha "$GITHUB_SHA" --non-interactive --label "$TRAINEE_DEPLOY_LABEL"
      - name: Collect the provenance manifest, the rollback copy and the log, secrets masked
        if: always()
        env:
          MASK_1: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MASK_2: ${{ secrets.SUPABASE_DB_URL }}
          MASK_3: ${{ secrets.CAREER_INGEST_SECRET }}
          MASK_4: ${{ secrets.CAREER_PROACTIVE_SECRET }}
          MASK_5: ${{ secrets.TRAINEE_DELIVER_SECRET }}
          MASK_6: ${{ secrets.TRAINEE_INBOUND_SECRET }}
          MASK_7: ${{ secrets.OPENAI_API_KEY }}
          MASK_8: ${{ secrets.LOOPMESSAGE_API_KEY }}
          MASK_9: ${{ secrets.INGEST_CONTACT_EMAIL }}
          MASK_10: ${{ secrets.TRAINEE_ALLOWED_CONTACTS }}
          MASK_11: ${{ secrets.PDL_API_KEY }}
          MASK_12: ${{ secrets.UPMORE_TEST_JWT }}
          MASK_13: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MASK_14: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          MASK_15: ${{ secrets.WHATSAPP_TOKEN }}
          MASK_16: ${{ secrets.WHATSAPP_APP_SECRET }}
          MASK_17: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          MASK_18: ${{ secrets.CLOUD_RUNNER_SECRET }}
          MASK_19: ${{ secrets.CLOUD_DISPATCH_SECRET }}
          MASK_20: ${{ secrets.CAREER_PREPARE_AHEAD_TOKEN }}
          MASK_21: ${{ secrets.VERCEL_TOKEN }}
          MASK_22: ${{ secrets.CAREER_PREPARE_AHEAD_URL }}
        run: |
          out="$RUNNER_TEMP/deploy-artifacts"; mkdir -p "$out"
          cp "$RUNNER_TEMP/go-live/go-live.log" "$out/" 2>/dev/null || echo "no log was written"
          cp "$HOME"/trainee-provenance/manifest-*.json "$out/" 2>/dev/null || echo "no provenance manifest was written"
          if [ -d "$HOME/trainee-rollback" ]; then cp -r "$HOME/trainee-rollback" "$out/rollback"; fi
          # Defence in depth over the script's own mask: every secret value (and the database password on its own) is
          # replaced by *** in every collected file before upload. The values are read from the environment, never printed.
          python3 scripts/launch/mask-artifacts.py "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-production-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-artifacts
          if-no-files-found: warn
          retention-days: 90
