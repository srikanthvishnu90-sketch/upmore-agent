  <meta name="description" content="At Snowflake, we are powering the era of the agentic enterprise. To usher in this new era, we seek AI-native thinkers across every function who are energized by the opportunity to reinvent how they work. You don’t just use tools; you possess an innate curiosity, treating AI as a high-trust collaborator that is core to how you solve problems and accelerate your impact. We look for low-ego individuals who thrive in dynamic and fast-moving environments and move with an experimental mindset — who rapidly test emerging capabilities to discover simpler, more powerful ways to deliver results. At Snowflake, your role isn't just to execute a function, but to help redefine the future of how work gets done.


ABOUT THE TEAM

Strategic Finance is the commercial and analytical engine behind Snowflake's product and revenue decisions. The team operates at the intersection of product strategy, pricing, and investment prioritization. Strategic Engagements, the function this role sits within, owns Snowflake's most consequential customer pursuits, partnerships, and M&amp;A engagements. We bring financial, product, market, and pricing depth to the deals that determine quarters, set commercial precedent, and shape Snowflake's largest customer relationships.


ABOUT THE ROLE

We are hiring an International Strategic Engagements Deal Lead to own the commercial structuring and execution of Snowflake's most consequential customer engagements outside North America. You will be the in-region point person for Strategic Engagements across EMEA, APAC, and other international markets, providing time-zone coverage, local commercial relationships, and regional commercial structuring expertise that the NoAM-based team cannot deliver remotely.

You will own the deal-by-deal economic frame, commercial recommendation, and structuring approach for qualifying international engagements across the full deal portfolio: net-new logo acquisitions, installed-base expansions, partnership-driven structures, and precedent-setting deals. You will partner directly with regional account leadership, Specialist Sales, AI Specialists, regional Deal Desk, regional Legal, regional Revenue Accounting, and the central Strategic Engagements team. You will join customer conversations on qualifying deals, particularly with senior customer stakeholders (CFO, COO, CIO, CPO).


IN THIS ROLE YOU WILL

 - Own International Deal Economics. Build the deal-by-deal economic frame for qualifying international engagements. Workload mix, capacity sizing, multi-year ramp, hybrid AI structures, multi-product economics, and competitive positioning. Translate the frame into a clear commercial recommendation that accounts for regional commercial realities.

 - Lead Regional Commercial Structuring. Lead pricing and commercial structuring across capacity, consumption, hybrid AI, and multi-product deal structures. Bring regional competitive benchmarks, willingness-to-pay context, and unit economics into structuring conversations. Navigate multi-currency exposure, regional revenue recognition treatment, sovereignty constraints, and local commercial conventions.

 - Provide Time-Zone Coverage. Be the in-region escalation point for live deals. Drive cross-functional decisions to closure on regional time, without waiting for NoAM business hours.

 - Build Local Relationships. Build and maintain the regional cross-functional relationships (regional Deal Desk, Legal, Revenue Accounting, AI Specialists, Sales leadership) that allow Strategic Engagements to execute at speed in your markets.

 - Shape Commercial Outcomes. Shape the commercial strategy, sequencing, and economic frame that gives the account team the strongest path to win acquisition deals at defensible terms and to protect margin discipline on expansion deals. Deal outcomes are jointly owned with the account team; you own the Snowflake-side commercial frame and recommendation.

 - Run Concession Discipline. Track concessions live against tiered margin-dilution thresholds. Escalate structural concessions (renewal caps, evergreen discounts, affiliate-use extensions, termination-for-convenience, multi-year ramp giveaways) regardless of size. Gate signature on a passed readiness check.

 - Coach the Field. Coach regional AEs on package strategy, negotiation sequencing, and how to position the deal. Bring the Strategic Engagements playbook into the field engagement, adapted for regional commercial norms.

 - Engage Customers Directly. Join customer conversations on qualifying deals with senior customer stakeholders. The account team owns the customer relationship and close authority. You bring the commercial, financial, and pricing depth into the room.

 - Adhere to the Deal Playbook. Run every deal in line with Strategic Engagements playbook standards: financial controls (booking accuracy, revenue recognition, concession tracking), deal process discipline, system requirements (CRM, contract management, billing), and legal compliance.

 - Operate AI-Native by Default. Use AI-assisted workflows for deal-economics modeling, redline triage, stakeholder synthesis, recommendation drafting, and competitive benchmarking. AI is a default execution mode, not an enhancement layer.

 - Build the Repeatable Playbook. Feed lessons from every closed international deal back into qualification criteria, regional commercial structuring patterns, fallback library, and lifecycle artifacts. Calibrate the playbook quarterly through the Strategic Engagements postmortem.

 - Communicate to Executives. Produce the recommendation memos, daily deal update notes, and quarterly postmortem materials that connect deal status, commercial structure, key risks, and decisions in flight to executive sponsors and the CFO when material.


WHAT YOU WILL NEED


REQUIRED

 - 10+ years of experience in strategic finance, deal desk, pricing, commercial operations, sales finance, investment banking, or equivalent commercial roles, with a track record of structuring complex international commercial deals at a scaling technology company.

 - Demonstrated experience structuring large enterprise commercial deals across multiple international markets: multi-year capacity, consumption commitments, hybrid commercial structures, multi-currency exposure, and multi-product agreements. Comfort with deals greater than $75M TCV.

 - High agency and standalone execution. You can run a deal end-to-end with minimal management overhead, including across time zones from the central team. You define your own structure, generate your own scaffolding, and drive your own decisions to closure.

 - Deep regional commercial fluency. Working knowledge of regional pricing dynamics, revenue recognition treatment, sovereignty and regulatory constraints, and the relational and commercial norms of enterprise software in your region.

 - Strong financial modeling skills. Ability to build deal economic models, scenario analyses, sensitivity analyses, and concession ledgers that connect commercial structure to economic outcome.

 - Working understanding of cloud and software-as-a-service commercial models: pricing and packaging, billing and metering, revenue recognition, commercial contracting, and post-signature operations.

 - Customer-facing presence. Comfort engaging senior customer stakeholders (CFO, COO, CIO, CPO) on commercial structure, pricing, and economics, in-region.

 - Effective communicator. Capable of translating complex commercial structure into clean executive narratives, running productive multi-stakeholder meetings across time zones, and driving alignment in writing.

 - AI-native disposition. Comfortable using AI-assisted workflows for deal modeling, redline triage, stakeholder synthesis, and recommendation drafting as part of how you work.

 - Comfort with ambiguity. Willingness to operate on precedent-setting deals where commercial mechanics are not yet standardized.

 - Bachelor's degree in Finance, Economics, Computer Science, Engineering, or related discipline. MBA or advanced degree preferred.


PREFERRED

 - Hands-on experience structuring international deals at a high-growth cloud, data, AI, or SaaS company.

 - Established commercial relationships with regional Deal Desk, Legal, and Revenue Accounting at a major cloud or SaaS company.

 - Familiarity with consumption-based and usage-based pricing in cloud, data, or AI platforms.

 - Familiarity with regional revenue accounting nuances (e.g., IFRS 15 alongside ASC 606), SOX controls, and audit-ready process design.

 - Experience with competitive pricing analysis and willingness-to-pay research, particularly across multiple regional markets.

 - Multilingual professional fluency, where applicable to the region of focus.

 - SQL fluency or comfort working directly with commercial data in a cloud data platform.

Snowflake is growing fast, and we’re scaling our team to help enable and accelerate our growth. We are looking for people who share our values, challenge ordinary thinking, and push the pace of innovation while building a future for themselves and Snowflake.

How do you want to make your impact?

For jobs located in the United States, please visit the job posting on the Snowflake Careers Site for salary and benefits information: careers.snowflake.com http://careers.snowflake.com">

sted workflows for deal-economics modeling, redline triage, stakeholder synthesis, recommendation drafting, and competitive benchmarking. AI is a default execution mode, not an enhancement layer.</p></li><li><p style=\"min-height:1.5em\"><strong>Build the Repeatable Playbook.</strong> Feed lessons from every closed international deal back into qualification criteria, regional commercial structuring patterns, fallback library, and lifecycle artifacts. Calibrate the playbook quarterly through the Strategic Engagements postmortem.</p></li><li><p style=\"min-height:1.5em\"><strong>Communicate to Executives.</strong> Produce the recommendation memos, daily deal update notes, and quarterly postmortem materials that connect deal status, commercial structure, key risks, and decisions in flight to executive sponsors and the CFO when material.</p></li></ul><h2>What You Will Need</h2><h3>Required</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">10+ years of experience in strategic finance, deal desk, pricing, commercial operations, sales finance, investment banking, or equivalent commercial roles, with a track record of structuring complex international commercial deals at a scaling technology company.</p></li><li><p style=\"min-height:1.5em\">Demonstrated experience structuring large enterprise commercial deals across multiple international markets: multi-year capacity, consumption commitments, hybrid commercial structures, multi-currency exposure, and multi-product agreements. Comfort with deals greater than $75M TCV.</p></li><li><p style=\"min-height:1.5em\">High agency and standalone execution. You can run a deal end-to-end with minimal management overhead, including across time zones from the central team. You define your own structure, generate your own scaffolding, and drive your own decisions to closure.</p></li><li><p style=\"min-height:1.5em\">Deep regional commercial fluency. Working knowledge of regional pricing dynamics, revenue recognition treatment, sovereignty and regulatory constraints, and the relational and commercial norms of enterprise software in your region.</p></li><li><p style=\"min-height:1.5em\">Strong financial modeling skills. Ability to build deal economic models, scenario analyses, sensitivity analyses, and concession ledgers that connect commercial structure to economic outcome.</p></li><li><p style=\"min-height:1.5em\">Working understanding of cloud and software-as-a-service commercial models: pricing and packaging, billing and metering, revenue recognition, commercial contracting, and post-signature operations.</p></li><li><p style=\"min-height:1.5em\">Customer-facing presence. Comfort engaging senior customer stakeholders (CFO, COO, CIO, CPO) on commercial structure, pricing, and economics, in-region.</p></li><li><p style=\"min-height:1.5em\">Effective communicator. Capable of translating complex commercial structure into clean executive narratives, running productive multi-stakeholder meetings across time zones, and driving alignment in writing.</p></li><li><p style=\"min-height:1.5em\">AI-native disposition. Comfortable using AI-assisted workflows for deal modeling, redline triage, stakeholder synthesis, and recommendation drafting as part of how you work.</p></li><li><p style=\"min-height:1.5em\">Comfort with ambiguity. Willingness to operate on precedent-setting deals where commercial mechanics are not yet standardized.</p></li><li><p style=\"min-height:1.5em\">Bachelor's degree in Finance, Economics, Computer Science, Engineering, or related discipline. MBA or advanced degree preferred.</p></li></ul><h3>Preferred</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Hands-on experience structuring international deals at a high-growth cloud, data, AI, or SaaS company.</p></li><li><p style=\"min-height:1.5em\">Established commercial relationships with regional Deal Desk, Legal, and Revenue Accounting at a major cloud or SaaS company.</p></li><li><p style=\"min-height:1.5em\">Familiarity with consumption-based and usage-based pricing in cloud, data, or AI platforms.</p></li><li><p style=\"min-height:1.5em\">Familiarity with regional revenue accounting nuances (e.g., IFRS 15 alongside ASC 606), SOX controls, and audit-ready process design.</p></li><li><p style=\"min-height:1.5em\">Experience with competitive pricing analysis and willingness-to-pay research, particularly across multiple regional markets.</p></li><li><p style=\"min-height:1.5em\">Multilingual professional fluency, where applicable to the region of focus.</p></li><li><p style=\"min-height:1.5em\">SQL fluency or comfort working directly with commercial data in a cloud data platform.</p></li></ul><p style=\"min-height:1.5em\">Snowflake is growing fast, and we’re scaling our team to help enable and accelerate our growth. We are looking for people who share our values, challenge ordinary thinking, and push the pace of innovation while building a future for themselves and Snowflake.</p><p style=\"min-height:1.5em\">How do you want to make your impact?</p><p style=\"min-height:1.5em\">For jobs located in the United States, please visit the job posting on the Snowflake Careers Site for salary and benefits information: <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://careers.snowflake.com\">careers.snowflake.com</a></p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Snowflake","value":"479e06f1-273d-4a1b-af56-6543761ebd75"},"datePosted":"2026-07-20","hiringOrganization":{"@type":"Organization","name":"Snowflake","sameAs":"https://www.snowflake.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/9fdea007-eec9-4e3a-b2f6-3ba1159f5962/9d45592a-7d07-4a07-b067-461f31dfdd74/b707aca0-b315-4ce2-8fcb-c03dd4d4cccf.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"London","addressCountry":"United Kingdom"}},"employmentType":"FULL_TIME"}</script>

dResumesThrowErrorFrontEnd","RejectInvalidFileTypeOnUpload","RejectUrlsInCandidateName","SchedulingCandidateAvailabilityNote","SchedulingDirectBookingLogDirectBookingEventsJson","SchedulingGCalSendUpdatesForCancelEvents","SchedulingMeetingLinkOptionality","SchedulingRescheduleAndCancellationReasonsNonUser","SchedulingUseLocaleInTimeFormatting","ShowCountsOnJobBoardFilterOptions","SocialSharingHtmlMetaSettings","UseGlobalQueryScopesOnGlobalApplicationQuestions","UseGoogleRecaptchaUniversalKey","UseJobPostingFiltersOnGlobalApplicationQuestions","UseJobPostingFiltersOnGlobalApplicationQuestionsUI","UseJobPostingFiltersOnSurveys","UseJobPostingFiltersOnSurveysUI","ValidateFileTypeOnUpload"],"timezone":"America/Los_Angeles","candidateScheduleCancellationReasonRequirementStatus":"Required","showCookieBanner":false,"__typename":"Organization"},"posting":{"id":"479e06f1-273d-4a1b-af56-6543761ebd75","title":"Lead, Strategic Finance - Deals (International)","departmentName":"Finance","departmentExternalName":"Finance","locationName":"GB-London","locationAddress":null,"workplaceType":null,"employmentType":"FullTime","descriptionHtml":"<p style=\"min-height:1.5em\">At Snowflake, we are powering the era of the agentic enterprise. To usher in this new era, we seek AI-native thinkers across every function who are energized by the opportunity to reinvent how they work. You don’t just use tools; you possess an innate curiosity, treating AI as a high-trust collaborator that is core to how you solve problems and accelerate your impact. We look for low-ego individuals who thrive in dynamic and fast-moving environments and move with an experimental mindset — who rapidly test emerging capabilities to discover simpler, more powerful ways to deliver results. At Snowflake, your role isn't just to execute a function, but to help redefine the future of how work gets done.</p><h2>About the Team</h2><p style=\"min-height:1.5em\">Strategic Finance is the commercial and analytical engine behind Snowflake's product and revenue decisions. The team operates at the intersection of product strategy, pricing, and investment prioritization. Strategic Engagements, the function this role sits within, owns Snowflake's most consequential customer pursuits, partnerships, and M&amp;A engagements. We bring financial, product, market, and pricing depth to the deals that determine quarters, set commercial precedent, and shape Snowflake's largest customer relationships.</p><p style=\"min-height:1.5em\"></p><h2>About the Role</h2><p style=\"min-height:1.5em\">We are hiring an International Strategic Engagements Deal Lead to own the commercial structuring and execution of Snowflake's most consequential customer engagements outside North America. You will be the in-region point person for Strategic Engagements across EMEA, APAC, and other international markets, providing time-zone coverage, local commercial relationships, and regional commercial structuring expertise that the NoAM-based team cannot deliver remotely.</p><p style=\"min-height:1.5em\">You will own the deal-by-deal economic frame, commercial recommendation, and structuring approach for qualifying international engagements across the full deal portfolio: net-new logo acquisitions, installed-base expansions, partnership-driven structures, and precedent-setting deals. You will partner directly with regional account leadership, Specialist Sales, AI Specialists, regional Deal Desk, regional Legal, regional Revenue Accounting, and the central Strategic Engagements team. You will join customer conversations on qualifying deals, particularly with senior customer stakeholders (CFO, COO, CIO, CPO).</p><p style=\"min-height:1.5em\"></p><h2>In This Role You Will</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Own International Deal Economics.</strong> Build the deal-by-deal economic frame for qualifying international engagements. Workload mix, capacity sizing, multi-year ramp, hybrid AI structures, multi-product economics, and competitive positioning. Translate the frame into a clear commercial recommendation that accounts for regional commercial realities.</p></li><li><p style=\"min-height:1.5em\"><strong>Lead Regional Commercial Structuring.</strong> Lead pricing and commercial structuring across capacity, consumption, hybrid AI, and multi-product deal structures. Bring regional competitive benchmarks, willingness-to-pay context, and unit economics into structuring conversations. Navigate multi-currency exposure, regional revenue recognition treatment, sovereignty constraints, and local commercial conventions.</p></li><li><p style=\"min-height:1.5em\"><strong>Provide Time-Zone Coverage.</strong> Be the in-region escalation point for live deals. Drive cross-functional decisions to closure on regional time, without waiting for NoAM business hours.</p></li><li><p style=\"min-height:1.5em\"><strong>Build Local Relationships.</strong> Build and maintain the regional cross-functional relationships (regional Deal Desk, Legal, Revenue Accounting, AI Specialists, Sales leadership) that allow Strategic Engagements to execute at speed in your markets.</p></li><li><p style=\"min-height:1.5em\"><strong>Shape Commercial Outcomes.</strong> Shape the commercial strategy, sequencing, and economic frame that gives the account team the strongest path to win acquisition deals at defensible terms and to protect margin discipline on expansion deals. Deal outcomes are jointly owned with the account team; you own the Snowflake-side commercial frame and recommendation.</p></li><li><p style=\"min-height:1.5em\"><strong>Run Concession Discipline.</strong> Track concessions live against tiered margin-dilution thresholds. Escalate structural concessions (renewal caps, evergreen discounts, affiliate-use extensions, termination-for-convenience, multi-year ramp giveaways) regardless of size. Gate signature on a passed readiness check.</p></li><li><p style=\"min-height:1.5em\"><strong>Coach the Field.</strong> Coach regional AEs on package strategy, negotiation sequencing, and how to position the deal. Bring the Strategic Engagements playbook into the field engagement, adapted for regional commercial norms.</p></li><li><p style=\"min-height:1.5em\"><strong>Engage Customers Directly.</strong> Join customer conversations on qualifying deals with senior customer stakeholders. The account team owns the customer relationship and close authority. You bring the commercial, financial, and pricing depth into the room.</p></li><li><p style=\"min-height:1.5em\"><strong>Adhere to the Deal Playbook.</strong> Run every deal in line with Strategic Engagements playbook standards: financial controls (booking accuracy, revenue recognition, concession tracking), deal process discipline, system requirements (CRM, contract management, billing), and legal compliance.</p></li><li><p style=\"min-height:1.5em\"><strong>Operate AI-Native by Default.</strong> Use AI-assisted workflows for deal-economics modeling, redline triage, stakeholder synthesis, recommendation drafting, and competitive benchmarking. AI is a default execution mode, not an enhancement layer.</p></li><li><p style=\"min-height:1.5em\"><strong>Build the Repeatable Playbook.</strong> Feed lessons from every closed international deal back into qualification criteria, regional commercial structuring patterns, fallback library, and lifecycle artifacts. Calibrate the playbook quarterly through the Strategic Engagements postmortem.</p></li><li><p style=\"min-height:1.5em\"><strong>Communicate to Executives.</strong> Produce the recommendation memos, daily deal update notes, and quarterly postmortem materials that connect deal status, commercial structure, key risks, and decisions in flight to executive sponsors and the CFO when material.</p></li></ul><h2>What You Will Need</h2><h3>Required</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">10+ years of experience in strategic finance, deal desk, pricing, commercial operations, sales finance, investment banking, or equivalent commercial roles, with a track record of structuring complex international commercial deals at a scaling technology company.</p></li><li><p style=\"min-height:1.5em\">Demonstrated experience structuring large enterprise commercial deals across multiple international markets: multi-year capacity, consumption commitments, hybrid commercial structures, multi-currency exposure, and multi-product agreements. Comfort with deals greater than $75M TCV.</p></li><li><p style=\"min-height:1.5em\">High agency and standalone execution. You can run a deal end-to-end with minimal management overhead, including across time zones from the central team. You define your own structure, generate your own scaffolding, and drive your own decisions to closure.</p></li><li><p style=\"min-height:1.5em\">Deep regional commercial fluency. Working knowledge of regional pricing dynamics, revenue recognition treatment, sovereignty and regulatory constraints, and the relational and commercial norms of enterprise software in your region.</p></li><li><p style=\"min-height:1.5em\">Strong financial modeling skills. Ability to build deal economic models, scenario analyses, sensitivity analyses, and concession ledgers that connect commercial structure to economic outcome.</p></li><li><p style=\"min-height:1.5em\">Working understanding of cloud and software-as-a-service commercial models: pricing and packaging, billing and metering, revenue recognition, commercial contracting, and post-signature operations.</p></li><li><p style=\"min-height:1.5em\">Customer-facing presence. Comfort engaging senior customer stakeholders (CFO, COO, CIO, CPO) on commercial structure, pricing, and economics, in-region.</p></li><li><p style=\"min-height:1.5em\">Effective communicator. Capable of translating complex commercial structure into clean executive narratives, running productive multi-stakeholder meetings across time zones, and driving alignment in writing.</p></li><li><p style=\"min-height:1.5em\">AI-native disposition. Comfortable using AI-assisted workflows for deal modeling, redline triage, stakeholder synthesis, and recommendation drafting as part of how you work.</p></li><li><p style=\"min-height:1.5em\">Comfort with ambiguity. Willingness to operate on precedent-setting deals where commercial mechanics are not yet standardized.</p></li><li><p style=\"min-height:1.5em\">Bachelor's degree in Finance, Economics, Computer Science, Engineering, or related discipline. MBA or advanced degree preferred.</p></li></ul><h3>Preferred</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Hands-on experience structuring international deals at a high-growth cloud, data, AI, or SaaS company.</p></li><li><p style=\"min-height:1.5em\">Established commercial relationships with regional Deal Desk, Legal, and Revenue Accounting at a major cloud or SaaS company.</p></li><li><p style=\"min-height:1.5em\">Familiarity with consumption-based and usage-based pricing in cloud, data, or AI platforms.</p></li><li><p style=\"min-height:1.5em\">Familiarity with regional revenue accounting nuances (e.g., IFRS 15 alongside ASC 606), SOX controls, and audit-ready process design.</p></li><li><p style=\"min-height:1.5em\">Experience with competitive pricing analysis and willingness-to-pay research, particularly across multiple regional markets.</p></li><li><p style=\"min-height:1.5em\">Multilingual professional fluency, where applicable to the region of focus.</p></li><li><p style=\"min-height:1.5em\">SQL fluency or comfort working directly with commercial data in a cloud data platform.</p></li></ul><p style=\"min-height:1.5em\">Snowflake is growing fast, and we’re scaling our team to help enable and accelerate our growth. We are looking for people who share our values, challenge ordinary thinking, and push the pace of innovation while building a future for themselves and Snowflake.</p><p style=\"min-height:1.5em\
