# Owner-approved comparison. Higher arm stays held until failure analysis is reported.
# Publishing this on a wo/ branch does not trigger any paid job.
name: brain-reliability-320
on:
  push:
    branches: [ci/brain320-mini-20261021, ci/brain320-higher-20261021]
    paths: [.github/workflows/brain-reliability-320.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: brain-eval
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      SOURCE_COMMIT: 1ec88f3cca4b21200be5c4f16ba2a948a72614b0
      CORPUS_SHA256: 91dabe21a0f0c0dd6de1c6be780dda53941c9ff532f03f172013b90c934f72bc
      MINI_APPROVAL_REF: OWNER_20261021_MINI_22671697_0cb4b980_CAP5
      HIGHER_APPROVAL_REF: OWNER_20261021_ANALYSIS_FIRST_HIGHER_CAP8
      OWNER_POOL_REF: OWNER_20261021_DUAL_MODEL_TOTAL20_NEW_BUDGET35
      # The owner allocated $20 across both runs; the earlier $0.139984 is separate.
      COMPARISON_CAP_USD: "20"
      HIGHER_CAP_USD: "8"
      FIRST_ARM_RUN_ID: "39666739440"
      FIRST_ARM_RESULT_SHA256: 72539f4b441f29c9a35e3f68385e2d15b01cb91aca57979a7bdbe08472ddd927
      FIRST_ARM_VERIFY_REF: CODEX_RECOVERY_39669772205_LEDGER_2181_CALLS
      HIGHER_RECHECK_APPROVAL_REF: OWNER_20261021_POST_MINI_RECHECK_ANALYSIS_FIRST_CAP8
      FAILURE_ANALYSIS_RUN_ID: "39673893860"
      FAILURE_ANALYSIS_REPORT_SHA256: c590ed9005f1069680b19055f12434973516f27915ff5ba23dbafd4508553a38
      FAILURE_ANALYSIS_REPORTED_REF: OWNER_CHAT_20261021_ANALYSIS_21a865a5_REPORTED_BEFORE_HIGHER
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Reject retries and unapproved proposals before checkout or provider access
        env:
          ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$ATTEMPT" = "1"
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          case "$REF_NAME" in
            ci/brain320-mini-20261021) MODEL=gpt-5-mini; APPROVAL_REF="$MINI_APPROVAL_REF" ;;
            ci/brain320-higher-20261021)
              MODEL=gpt-5; APPROVAL_REF="$HIGHER_APPROVAL_REF"
              [[ "$FIRST_ARM_RUN_ID" =~ ^[0-9]+$ ]]
              [[ "$FIRST_ARM_RESULT_SHA256" =~ ^[a-f0-9]{64}$ ]]
              test "$FIRST_ARM_VERIFY_REF" != "NOT_VERIFIED"
              [[ "$FAILURE_ANALYSIS_RUN_ID" =~ ^[0-9]+$ ]]
              [[ "$FAILURE_ANALYSIS_REPORT_SHA256" =~ ^[a-f0-9]{64}$ ]]
              test -n "$FAILURE_ANALYSIS_REPORTED_REF"
              test "$FAILURE_ANALYSIS_REPORTED_REF" != "NOT_REPORTED"
              test "$HIGHER_CAP_USD" = "8"
              ;;
            *) exit 2 ;;
          esac
          test -n "$APPROVAL_REF"
          test "$APPROVAL_REF" != "NOT_APPROVED"
          test -n "$OWNER_POOL_REF"
          test "$OWNER_POOL_REF" != "NOT_APPROVED"
          test "$COMPARISON_CAP_USD" = "20"
          echo "BRAIN320_MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "BRAIN320_APPROVAL_REF=$APPROVAL_REF" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1
      - uses: denoland/setup-deno@v2
        with: {deno-version: "v2.9.6"}
      - name: Free runner controls, with network denied
        run: |
          deno check evals/brain-reliability/run-comparison.ts tests/architect/brain-eval-comparison.test.ts
          deno test --no-check --cached-only --no-remote --allow-read="$GITHUB_WORKSPACE" --deny-net --no-prompt tests/architect/brain-eval-comparison.test.ts
      - name: Retrieve the first arm's complete private evidence for the higher arm
        if: env.BRAIN320_MODEL == 'gpt-5'
        uses: actions/download-artifact@v4
        with:
          name: brain320-${{ env.FIRST_ARM_RUN_ID }}-1
          run-id: ${{ env.FIRST_ARM_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/mini-proof
      - name: Bind approval to source, corpus, model and the owner's $20 allocation
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          src=pathlib.Path("evals/brain-reliability/scenarios320.json").read_bytes()
          assert hashlib.sha256(src).hexdigest()==os.environ["CORPUS_SHA256"]
          model=os.environ["BRAIN320_MODEL"]
          ref=os.environ["BRAIN320_APPROVAL_REF"]
          approval={"owner_approval_ref":ref,"model":model,
            "source_commit":os.environ["SOURCE_COMMIT"],"corpus_sha256":os.environ["CORPUS_SHA256"],
            "comparison_cap_usd":20,"comparison_spent_usd":0,"cap_usd":5,
            "owner_allocated_pool_ref":os.environ["OWNER_POOL_REF"],
            "prior_settled_usd":0.139984,
            "new_budget_spent_usd":None,"other_reserved_usd":None,"ledger_snapshot_at":None}
          if model=="gpt-5":
              first=pathlib.Path(os.environ["RUNNER_TEMP"],"mini-proof","brain320-result.json")
              raw=first.read_bytes(); digest=hashlib.sha256(raw).hexdigest()
              assert digest==os.environ["FIRST_ARM_RESULT_SHA256"], "First-arm evidence hash differs"
              mini=json.loads(raw)
              spent=mini["ledger"]["usd_micros"]
              assert isinstance(spent,int) and 0<=spent<=5_000_000
              assert mini["model"]=="gpt-5-mini" and mini["status"]=="SCORED"
              assert os.environ["HIGHER_CAP_USD"]=="8"
              higher_cap_micros=min(8_000_000,20_000_000-spent)
              assert higher_cap_micros>0
              # The runner verifies all result, usage, rubric and same-source identities again before any call.
              approval.update({"comparison_spent_usd":spent/1_000_000,
                "cap_usd":higher_cap_micros/1_000_000,
                "approved_over_ten":False,
                "failure_analysis":{"run_id":os.environ["FAILURE_ANALYSIS_RUN_ID"],
                  "report_sha256":os.environ["FAILURE_ANALYSIS_REPORT_SHA256"],
                  "reported_ref":os.environ["FAILURE_ANALYSIS_REPORTED_REF"]},
                "first_arm_evidence":{"result_path":str(first),"sha256":digest,
                  "verified_by":"Codex from the first CI arm and its complete artifact",
                  "verification_ref":os.environ["FIRST_ARM_VERIFY_REF"]}})
              if spent>2_143_269:
                  recheck=os.environ["HIGHER_RECHECK_APPROVAL_REF"]
                  assert recheck!="NOT_APPROVED" and recheck.strip(), "Mini exceeded estimate; owner's re-check required"
                  approval["mini_over_estimate_recheck_ref"]=recheck
              assert round(approval["cap_usd"]*1_000_000)+spent<=20_000_000
          assert approval["cap_usd"]<=10 or ref.startswith("OWNER_EXPLICIT_OVER_10:"), "Explicit owner word for higher run required"
          p=pathlib.Path(os.environ["RUNNER_TEMP"],"brain320-approval.json")
          p.write_text(json.dumps(approval))
          p.chmod(0o600)
          PY
      - name: One approved arm, no retries; keep sealed item evidence out of job logs
        run: |
          deno run --cached-only --no-remote --allow-read --allow-write="$RUNNER_TEMP" --allow-env=OPENAI_API_KEY --allow-net=api.openai.com --allow-run=git --no-prompt \
            evals/brain-reliability/run-comparison.ts --run-approved --model "$BRAIN320_MODEL" \
            --corpus evals/brain-reliability/scenarios320.json --manifest evals/brain-reliability/manifest320.json \
            --approval-file "$RUNNER_TEMP/brain320-approval.json" --out "$RUNNER_TEMP/brain320-result" \
            > "$RUNNER_TEMP/brain320-diagnostic.log" 2>&1
      - name: Aggregate ledger only, including reservations left unresolved by a failed run
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/brain320-result.json"; then
            deno eval 'import {armSummary} from "./evals/brain-reliability/run-comparison.ts"; const raw=await Deno.readTextFile(Deno.env.get("RUNNER_TEMP")+"/brain320-result.json"); const a=JSON.parse(raw); const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(raw)); const result_sha256=[...new Uint8Array(hash)].map(n=>n.toString(16).padStart(2,"0")).join(""); console.log(JSON.stringify({result_sha256,...armSummary(a)},null,2));'
          elif test -f "$RUNNER_TEMP/brain320-result.journal.jsonl"; then
            deno eval 'import {recoverJournal} from "./evals/brain-reliability/run-comparison.ts"; const r=recoverJournal(await Deno.readTextFile(Deno.env.get("RUNNER_TEMP")+"/brain320-result.journal.jsonl")); console.log(JSON.stringify({status:"NOT_SCORED",ledger:r},null,2));'
          else
            echo 'NOT_RUN: no provider-call reservation journal exists'
          fi
      - name: Paired aggregate comparison for complete reconciled arms
        if: always() && env.BRAIN320_MODEL == 'gpt-5'
        env:
          OPENAI_API_KEY: ""
        run: |
          cat > "$RUNNER_TEMP/brain320-compare.ts" <<'TS'
          const {armSummary,compareArms}=await import("file://"+Deno.cwd()+"/evals/brain-reliability/run-comparison.ts");
          const folder=Deno.env.get("RUNNER_TEMP")!;
          let firstRaw:string,secondRaw:string;
          try {
            firstRaw=await Deno.readTextFile(folder+"/mini-proof/brain320-result.json");
            secondRaw=await Deno.readTextFile(folder+"/brain320-result.json");
          } catch(e) {
            if(!(e instanceof Deno.errors.NotFound))throw e;
            console.log(JSON.stringify({status:"NOT_COMPARABLE",reason:"Complete result evidence is missing"}));
            Deno.exit(0);
          }
          const first=JSON.parse(firstRaw),second=JSON.parse(secondRaw);
          const mini=armSummary(first),higher=armSummary(second);
          const result=mini.status==="SCORED"&&higher.status==="SCORED"
            ?{status:"COMPARABLE",...compareArms(first,second)}
            :{status:"NOT_COMPARABLE",mini_status:mini.status,higher_status:higher.status,
              mini_cost_usd:mini.cost_usd,higher_cost_usd:higher.cost_usd};
          await Deno.writeTextFile(folder+"/brain320-comparison.json",JSON.stringify(result));
          console.log(JSON.stringify(result,null,2));
          TS
          deno run --cached-only --no-remote --deny-net --allow-read="$GITHUB_WORKSPACE,$RUNNER_TEMP" \
            --allow-env=RUNNER_TEMP --allow-write="$RUNNER_TEMP/brain320-comparison.json" --no-prompt "$RUNNER_TEMP/brain320-compare.ts"
      - name: Preserve private packets, per-call usage, exact metered costs and diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain320-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/brain320-approval.json
            ${{ runner.temp }}/brain320-approval.json.consumed
            ${{ runner.temp }}/brain320-result.json
            ${{ runner.temp }}/brain320-result.journal.jsonl
            ${{ runner.temp }}/brain320-diagnostic.log
            ${{ runner.temp }}/brain320-comparison.json

