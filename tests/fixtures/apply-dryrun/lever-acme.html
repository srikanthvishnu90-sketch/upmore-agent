<!doctype html><html><head><meta charset="utf-8"><title>Acme Robotics - Software Engineer (TEST fixture)</title><style>body{font:15px system-ui;max-width:680px;margin:20px auto}ul{list-style:none;padding:0}.application-label{font-weight:600;margin:12px 0 4px}input[type=text],input[type=email],textarea,select{width:100%;padding:7px;box-sizing:border-box}</style></head><body>
<p>TEST FIXTURE modeled on a Lever application page (not a real employer)</p>
<form id="application-form" enctype="multipart/form-data" method="POST"><div class="section application-form"><h4>Submit your application</h4><ul>
<li class="application-question resume"><label><div class="application-label">Resume/CV <span class="required">✱</span></div><div class="application-field"><a href="#" class="postings-btn"><span class="default-label">ATTACH RESUME/CV</span><input class="application-file-input" id="resume-upload-input" name="resume" type="file" style="display:none" required></a></div></label></li>
<li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" name="name" required></div></label></li>
<li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input name="email" type="email" required></div></label></li>
<li class="application-question"><label><div class="application-label">Phone </div><div class="application-field"><input type="text" name="phone"></div></label></li>
<li class="application-question"><label><div class="application-label">Current location </div><div class="application-field"><input type="text" name="location"><input type="hidden" name="selectedLocation"></div></label></li>
<li class="application-question"><label><div class="application-label">Current company </div><div class="application-field"><input type="text" name="org"></div></label></li></ul></div>
<div class="section application-form"><h4>Links</h4><ul><li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
<li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li></ul></div>
<div class="section application-form"><h4>United States</h4><ul>
<li class="application-question custom-question"><label><div class="application-label">Do you now, or in the future require sponsorship?<span class="required">✱</span></div><div class="application-field"><ul data-qa="multiple-choice">
 <li><label><input type="radio" name="cards[s1]" value="Yes" required><span class="application-answer-alternative">Yes</span></label></li><li><label><input type="radio" name="cards[s1]" value="No" required><span class="application-answer-alternative">No</span></label></li></ul></div></label></li>
<li class="application-question custom-question"><label><div class="application-label">What are your salary expectations?<span class="required">✱</span></div><div class="application-field"><input type="text" name="cards[s2]" required></div></label></li>
<li class="application-question custom-question"><label><div class="application-label">Which regions can you work in?</div><div class="application-field"><ul data-qa="checkboxes">
 <li><label><input type="checkbox" name="cards[s3]" value="NA"><span class="application-answer-alternative">North America</span></label></li><li><label><input type="checkbox" name="cards[s3]" value="EU"><span class="application-answer-alternative">Europe</span></label></li><li><label><input type="checkbox" name="cards[s3]" value="AS"><span class="application-answer-alternative">Asia</span></label></li></ul></div></label></li>
<li class="application-question custom-question"><label><div class="application-label">How did you hear about us?</div><div class="application-field"><select name="cards[s4]"><option value="">Select...</option><option>LinkedIn</option><option>Friend</option><option>Other</option></select></div></label></li>
<li class="application-question"><label><div class="application-label">Additional information</div><div class="application-field"><textarea name="comments"></textarea></div></label></li></ul></div>
<div class="section application-form" id="eeo"><h4>U.S. Equal Employment Opportunity information (optional)</h4><ul>
<li class="application-question"><label><div class="application-label">Gender</div><div class="application-field"><select name="eeo[gender]"><option value="">Select...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></div></label></li>
<li class="application-question"><label><div class="application-label">Race</div><div class="application-field"><select name="eeo[race]"><option value="">Select...</option><option>Asian</option><option>White</option><option>Decline to self-identify</option></select></div></label></li>
<li class="application-question"><label><div class="application-label">Veteran status</div><div class="application-field"><select name="eeo[veteran]"><option value="">Select...</option><option>I am not a veteran</option><option>I am a veteran</option><option>Decline to self-identify</option></select></div></label></li></ul></div>
<div class="h-captcha" data-sitekey="TEST-NEVER-SOLVED"></div>
<button type="submit" class="postings-btn" data-qa="btn-submit">Submit application</button></form><script src="/widgets.js"></script></body></html>
