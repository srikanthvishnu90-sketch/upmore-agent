# WO-017: what a person would see. For 10 job seekers (not all tech), the open postings matching their search in their
# place, before and after a directory change, read with the product's own feed reader and search. Runs in a PR that
# changes the directory or the measure, because CI has the internet access the build sandbox lacks. Public GETs only.
name: coverage-personas
on:
  pull_request:
    paths:
      - packages/career-data/board-directory.json
      - evals/career/coverage-personas.ts
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: "v2.9.6" }
      - name: Persona coverage, before and after
        run: deno run -A --no-check evals/career/coverage-personas.ts --out coverage-personas.json
      - uses: actions/upload-artifact@v4
        with: { name: coverage-personas, path: coverage-personas.json, retention-days: 14 }
